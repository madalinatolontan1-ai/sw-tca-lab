<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMEA Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/pcb.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: FMEA workbench in the APIS spirit. Header with student/variant; one tab per analysis (HW signal, SW function);
   inside each, three steps: structure + functions, failure net (effects | modes | causes, linked by dragging), risk + optimization. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #17202D; --muted: #5B6578; --line: #D9DEE7;
  --accent: #2443C4; --accent-ink: #FFFFFF; --accent-soft: #E6EBFB; --code-bg: #F9FAFC;
  --ok: #1D7F54; --ok-bg: #DFF2E8; --bad: #B83434; --bad-bg: #FBE6E6; --warn: #9A6514; --warn-bg: #FAEFD8;
  --fn: #1D7F54; --fail: #B83434; --link: #6C7891; --link-hi: #2443C4;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
    --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
    --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
    --fn: #4BC287; --fail: #F07474; --link: #7D889C; --link-hi: #8197FF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
  --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
  --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
  --fn: #4BC287; --fail: #F07474; --link: #7D889C; --link-hi: #8197FF;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, h4 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.05rem; font-weight: 600; }
h4 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.small { font-size: 0.86rem; }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .sub { font-size: 0.85rem; color: var(--muted); }
.student { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
input.in, select.in, textarea.in { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); min-width: 0; }
input.in, select.in { height: 34px; padding: 0 9px; }
textarea.in { width: 100%; min-height: 70px; padding: 7px 9px; resize: vertical; }
.w-name { width: 190px; } .w-small { width: 92px; }
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 0.84rem; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--bad); border-color: transparent; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 24px; height: 24px; border-radius: 4px; line-height: 1; font-size: 1rem; flex: none; }
.x:hover { color: var(--bad); background: var(--bad-bg); }
.lang, .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 0 10px; height: 32px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 24px; padding: 2px 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 12px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:disabled { opacity: 0.45; cursor: not-allowed; }
main .wrap { padding-block: 22px 48px; display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.intro { max-width: 78ch; display: flex; flex-direction: column; gap: 12px; }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.grid-start { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.grid-struct { display: grid; grid-template-columns: minmax(220px, 3fr) minmax(0, 4fr) minmax(0, 5fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .grid-struct { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .grid-struct > .ctx, .grid-struct > .sidecol { grid-column: 1 / -1; } }
@media (max-width: 760px) { .grid-start, .grid-struct { grid-template-columns: minmax(0, 1fr); } }
table.mini { border-collapse: collapse; font-size: 0.84rem; width: 100%; }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
table.mini th { background: var(--bg); font-weight: 600; }
table.mini td.c { text-align: center; font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }

/* step navigation */
.steps { display: flex; gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.steps button { flex: 1 1 200px; border: 0; border-right: 1px solid var(--line); background: transparent; padding: 10px 14px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px; }
.steps button:last-child { border-right: 0; }
.steps button .n { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }
.steps button .tt { font-family: var(--font-display); font-weight: 600; }
.steps button[aria-current="step"] { background: var(--accent-soft); box-shadow: inset 0 -3px 0 var(--accent); }

/* structure tree */
.tree { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tree li { display: block; }
.tree button { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 7px 10px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.tree button[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); }
.tree .lvl { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); flex: none; }
.tree .cnt { margin-left: auto; font-family: var(--font-mono); font-size: 0.75rem; color: var(--fn); flex: none; }
.tree .l2 { padding-left: 16px; } .tree .l3 { padding-left: 32px; }
.fnlist { display: flex; flex-direction: column; gap: 6px; }
.fnitem { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 8px 7px 10px; }
.fnitem .txt { color: var(--fn); flex: 1; min-width: 0; overflow-wrap: anywhere; }
.addrow { display: flex; gap: 8px; }
.addrow input { flex: 1; }
.req { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; font-size: 0.86rem; padding: 6px 0; border-bottom: 1px solid var(--line); }
.req:last-child { border-bottom: 0; }
.req .id { font-family: var(--font-mono); font-weight: 600; color: var(--accent); white-space: nowrap; }
pre.code { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; overflow-x: auto; font: 0.8rem/1.5 var(--font-mono); }

/* failure net */
.netwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.net { position: relative; display: grid; grid-template-columns: repeat(3, minmax(250px, 1fr)); gap: 0 72px; padding: 16px 20px 24px; min-width: 940px; }
.net svg.links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.net svg.links path { fill: none; stroke: var(--link); stroke-width: 1.6; }
.net svg.links path.hi { stroke: var(--link-hi); stroke-width: 2.4; }
.net svg.links path.dim { opacity: 0.25; }
.net svg.links path.tmp { stroke: var(--link-hi); stroke-dasharray: 5 4; }
.net svg.links g.del { pointer-events: auto; cursor: pointer; }
.net svg.links g.del circle { fill: var(--surface); stroke: var(--link); stroke-width: 1.2; }
.net svg.links g.del text { fill: var(--muted); font: 600 11px var(--font-body); }
.net svg.links g.del:hover circle { stroke: var(--bad); fill: var(--bad-bg); }
.net svg.links g.del:hover text { fill: var(--bad); }
.col { display: flex; flex-direction: column; gap: 10px; min-width: 0; position: relative; z-index: 1; }
.colhead { border-bottom: 2px solid var(--line); padding-bottom: 6px; }
.grp { display: flex; flex-direction: column; gap: 6px; }
.grp .el { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; }
.grp .fn { color: var(--fn); font-size: 0.84rem; font-weight: 500; overflow-wrap: anywhere; }
.fcard { position: relative; border: 1px dashed var(--line); border-radius: var(--radius); background: var(--surface); padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.fcard.mode { border-style: solid; }
.fcard.mode.sel { background: #FFF6BF; border-color: #B79A10; color: #17202D; }
:root[data-theme="dark"] .fcard.mode.sel { background: #3B3412; border-color: #C9AB2A; color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .fcard.mode.sel { background: #3B3412; border-color: #C9AB2A; color: var(--ink); } }
.fcard.mode { cursor: pointer; }
.fcard.linked { border-color: var(--link-hi); border-style: solid; }
.fcard .ft { color: var(--fail); font-size: 0.88rem; overflow-wrap: anywhere; padding-right: 22px; }
.fcard .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 0.78rem; color: var(--muted); }
.fcard .meta select { height: 26px; font-size: 0.8rem; padding: 0 4px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); }
.fcard > .x { position: absolute; right: 2px; top: 2px; }
.hd { position: absolute; top: 50%; width: 14px; height: 14px; margin-top: -7px; border-radius: 50%; background: var(--surface); border: 2px solid var(--link); cursor: crosshair; touch-action: none; z-index: 2; }
.hd:hover, .hd.active { border-color: var(--link-hi); background: var(--accent-soft); }
.hd.r { right: -8px; } .hd.l { left: -8px; }
.lk { border: 1px solid var(--line); background: var(--bg); border-radius: 4px; font-size: 0.75rem; padding: 1px 7px; cursor: pointer; color: var(--muted); }
.lk.on { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.addf { display: flex; gap: 6px; }
.addf input { flex: 1; height: 30px; font-size: 0.85rem; }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px; color: var(--muted); font-size: 0.86rem; }

/* risk */
.mode-block { display: flex; flex-direction: column; gap: 12px; }
.mode-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.mode-head .ft { color: var(--fail); font-weight: 600; }
.risk { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 12px; background: var(--surface); }
.risk .cause { color: var(--fail); font-weight: 500; }
.culs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 6px; }
.cul { font: 600 0.72rem var(--font-mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); cursor: pointer; }
.cul.on, .chip.cul { border-color: var(--link-hi); color: var(--link-hi); }
.cul.on { background: color-mix(in srgb, var(--link-hi) 14%, transparent); }
.warnnote { border-left: 3px solid var(--bad); padding: 4px 8px; font-size: 0.84rem; color: var(--bad); background: var(--bad-bg); border-radius: 4px; margin: 0; }
.limnote { font-size: 0.84rem; color: var(--muted); margin-top: 6px; }
.states { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .states { grid-template-columns: minmax(0, 1fr); } }
.state { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--bg); min-width: 0; }
.state.off { opacity: 0.6; }
.state h4 { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.ctl { display: flex; flex-wrap: wrap; gap: 6px; }
.ctl .c { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 4px 1px 9px; font-size: 0.8rem; max-width: 100%; }
.ctl .c span { overflow-wrap: anywhere; }
.ctl .c b { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.rate { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rate select { height: 30px; }
.act { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.act .full { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.act .full > * { flex: 1 1 110px; }
.act .full > .x { flex: none; align-self: center; }
.act input, .act select { height: 30px; font-size: 0.84rem; }
.act select.res-pass { color: var(--ok); border-color: var(--ok); background: var(--ok-bg); font-weight: 600; }
.act select.res-fail { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); font-weight: 600; }
.ap { display: inline-block; min-width: 1.8em; text-align: center; border-radius: 4px; font-weight: 700; font-family: var(--font-mono); padding: 1px 6px; }
.ap.H { background: var(--bad-bg); color: var(--bad); }
.ap.M { background: var(--warn-bg); color: var(--warn); }
.ap.L { background: var(--ok-bg); color: var(--ok); }
.ap.na { background: var(--surface); color: var(--muted); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; padding: 0 10px; height: 32px; cursor: pointer; font-weight: 600; font-size: 0.85rem; color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.netchip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--surface); color: var(--ink); }
.netchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.netchips { display: flex; flex-wrap: wrap; gap: 6px; }
.boardbox { max-width: 640px; }
.sidecol .boardbox { max-width: none; }
details.boardpanel > div { max-width: 680px; }
.ctxbox { border-left: 3px solid var(--accent); }
.ctxbox p { margin-top: 4px; max-width: 110ch; }
details.help summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; }
details.help ol.task { margin: 10px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
table.aiag td { vertical-align: top; font-size: 0.8rem; }
.aiagnote { font-size: 0.78rem; margin-top: 6px; }
table.prov { border-collapse: collapse; font-size: 0.85rem; }
table.prov th { text-align: left; vertical-align: top; padding: 4px 8px 4px 0; white-space: nowrap; }
table.prov td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
.rate > label { flex: 1 1 100%; min-width: 0; }
.rate > label select { flex: 1 1 auto; min-width: 0; max-width: none; }
.fcard .meta select { max-width: 18em; }
details.ref { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.ref > summary { cursor: pointer; padding: 10px 14px; font-family: var(--font-display); font-weight: 600; }
details.ref > div { padding: 0 14px 14px; overflow-x: auto; }
.refs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; align-items: start; }
.checks { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.checks li { display: flex; gap: 8px; align-items: baseline; font-size: 0.88rem; }
.checks li b { font-family: var(--font-mono); font-size: 0.72rem; padding: 0 6px; border-radius: 4px; flex: none; }
.checks li.err b { background: var(--bad-bg); color: var(--bad); }
.checks li.warn b { background: var(--warn-bg); color: var(--warn); }
.report-frame { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; overflow-x: auto; }
.report-frame h1 { font-size: 1.35rem; } .report-frame h2 { font-size: 1.15rem; margin: 22px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.report-frame h3 { margin: 14px 0 6px; }
.report-frame table.r { border-collapse: collapse; font-size: 0.8rem; }
.report-frame table.r th, .report-frame table.r td { border: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.report-frame table.r th { background: var(--bg); }
.report-frame .fn { color: var(--fn); } .report-frame .fl { color: var(--fail); }
.report-frame .H { background: var(--bad-bg); color: var(--bad); font-weight: 700; } .report-frame .M { background: var(--warn-bg); color: var(--warn); font-weight: 700; } .report-frame .L { background: var(--ok-bg); color: var(--ok); }
.report-frame .chain { display: grid; grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr) 24px minmax(0, 1fr); gap: 6px; align-items: center; margin: 8px 0 14px; font-size: 0.82rem; }
.report-frame .chain .box { border: 1px dashed var(--line); border-radius: 4px; padding: 4px 6px; margin: 3px 0; }
.report-frame .chain .box.m { border: 1px solid #B79A10; background: #FFF6BF; color: #17202D; }
.report-frame .chain .arr { text-align: center; color: var(--muted); }
.report-frame .mx td { width: 46px; height: 26px; text-align: center; font-family: var(--font-mono); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; z-index: 20; max-width: calc(100vw - 32px); }
@media (max-width: 640px) { .student { margin-left: 0; } .w-name { width: 150px; } }
</style>

<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>FMEA Lab</h1>
      <span class="sub" data-i18n="subtitle"></span>

function pool(arr) {
  const seen = new Set(); const out = [];
  arr.forEach((x) => { const v = tr(x); if (v && !seen.has(v)) { seen.add(v); out.push(v); } });
  return out.sort((a, b) => a.localeCompare(b, LANG));
}
function fnPool(kind) {
  const v = V(); let a = SUG_FN.L1.common.concat(SUG_FN.L1[kind], SUG_FN.L2[kind === "hw" ? v.hw : v.sw]);
  if (kind === "hw") { Object.keys(HW_CAT_FN).forEach((k) => { a = a.concat(HW_CAT_FN[k]); }); HW_COMP[v.hw].forEach((c) => { a = a.concat(c.fn); }); }
  else Object.keys(SUG_FN.L3.sw).forEach((k) => { a = a.concat(SUG_FN.L3.sw[k]); });
  return pool(a);
}
function failPool(kind) {
  const v = V(); let a = SUG_EFFECT.common.concat(SUG_EFFECT[kind], SUG_MODE[kind === "hw" ? v.hw : v.sw]);
  if (kind === "hw") { a = a.concat(HW_CAT_FC); HW_COMP[v.hw].forEach((c) => { a = a.concat(c.fc); }); }
  else a = a.concat(SW_CAT_FC, SW_FN_FC[v.sw] || []);
  return pool(a);
}

}

const blankA = () => ({ fns: [], fails: [], links: [], risk: {}, step: "s23", selEl: "L1", selMode: "", side: "top", selComp: "" });

function load() { try { const r = localStorage.getItem(STORE_KEY); if (r) S = Object.assign(S, JSON.parse(r)); } catch (e) { /* storage unavailable */ } }

const fnById = (A, id) => A.fns.find((f) => f.id === id);
const failById = (A, id) => A.fails.find((f) => f.id === id);
function lvlOfFail(A, f) { const fn = fnById(A, f.fn); if (!fn) return 0; return fn.el === "L1" ? 1 : fn.el === "L2" ? 2 : 3; }

const linked = (A, m, x) => A.links.some((l) => l[0] === m && l[1] === x);
const effectsOf = (A, m) => A.links.filter((l) => l[0] === m && lvlOfFail(A, failById(A, l[1])) === 1).map((l) => failById(A, l[1]));
const causesOf = (A, m) => A.links.filter((l) => l[0] === m && lvlOfFail(A, failById(A, l[1])) === 3).map((l) => failById(A, l[1]));
function sMax(A, m) { const s = effectsOf(A, m).map((e) => +e.s || 0); return s.length && Math.max.apply(null, s) > 0 ? Math.max.apply(null, s) : null; }
const rkey = (m, c) => m + "|" + c;
function riskRec(A, m, c) {
  const k = rkey(m, c);
  if (!A.risk[k]) A.risk[k] = { pc: [], dc: [], o: "", d: "", acts: [], o2: "", d2: "", xtype: "D", xt: "", xo: "", xd: "", resid: "" };
  return A.risk[k];
}
function evalRisk(A, m, c) {
  const r = A.risk[rkey(m, c)] || {}; const s = sMax(A, m);
  const ap0 = apOf(s, +r.o, +r.d);
  const hasRev = (r.acts || []).length > 0 && r.o2 && r.d2;
  const o1 = hasRev ? +r.o2 : +r.o, d1 = hasRev ? +r.d2 : +r.d;
  const ap1 = hasRev ? apOf(s, o1, d1) : null;
  const afterRev = ap1 || ap0;
  const extraNeeded = !!(hasRev && (ap1 === "H" || ap1 === "M"));
  /* additional action: P (design change) lowers O, D (new test) lowers D */
  const xP = r.xtype === "P";
  const apX = extraNeeded && r.xt && (xP ? r.xo : r.xd) ? apOf(s, xP ? Math.min(o1, +r.xo) : o1, xP ? d1 : Math.min(d1, +r.xd)) : null;
  const fin = apX || afterRev;
  return { s: s, ap0: ap0, ap1: ap1, apX: apX, fin: fin, hasRev: hasRev, extraNeeded: extraNeeded, failOpen: failOpen(r), r: r };
}
/* a FAIL result confirms the defect: it needs a corrective design action (P) added after it */
function failOpen(r) {
  const acts = r.acts || [];
  return acts.some((a, i) => a.status === "done" && a.result === "fail" && !acts.slice(i + 1).some((b) => b.type === "P"));
}
function removeFail(A, id) {
  A.fails = A.fails.filter((f) => f.id !== id);
  A.links = A.links.filter((l) => l[0] !== id && l[1] !== id);
  Object.keys(A.risk).forEach((k) => { const p = k.split("|"); if (p[0] === id || p[1] === id) delete A.risk[k]; });
  if (A.selMode === id) A.selMode = "";
}
function removeFn(A, id) { A.fails.filter((f) => f.fn === id).map((f) => f.id).forEach((fid) => removeFail(A, fid)); A.fns = A.fns.filter((f) => f.id !== id); }
function toggleLink(A, a, b) {
  const fa = failById(A, a), fb = failById(A, b); if (!fa || !fb) return false;
  const la = lvlOfFail(A, fa), lb = lvlOfFail(A, fb);
  let m, x;
  if (la === 2 && (lb === 1 || lb === 3)) { m = a; x = b; } else if (lb === 2 && (la === 1 || la === 3)) { m = b; x = a; } else return false;
  if (linked(A, m, x)) { A.links = A.links.filter((l) => !(l[0] === m && l[1] === x)); if (lvlOfFail(A, failById(A, x)) === 3) delete A.risk[rkey(m, x)]; }
  else A.links.push([m, x]);

}
function addLink(A, a, b) {

  const la = lvlOfFail(A, fa), lb = lvlOfFail(A, fb);
  let m, x;
  if (la === 2 && (lb === 1 || lb === 3)) { m = a; x = b; } else if (lb === 2 && (la === 1 || la === 3)) { m = b; x = a; } else return false;
  if (!linked(A, m, x)) A.links.push([m, x]);

}

/* ================================================================ checks */
/* lab simplification (warnings only): one function per element, a few modes, effects and causes */
const LIM = { modes: 3, effects: 3, causes: 2 };
function checks(kind) {
  const A = S[kind]; const out = [];
  const add = (sev, key, o) => out.push({ sev: sev, msg: fmt(t(key), o || {}) });
  const short = (s) => (s.length > 48 ? s.slice(0, 46) + "…" : s);
  const els = elements(kind);
  els.forEach((e) => {
    const n = A.fns.filter((f) => f.el === e.id).length;
    if (e.lvl < 3 && !n) add("err", "c_noFn", { el: tr(e.name) });
    if (n > 1) add("warn", "c_manyFn", { el: tr(e.name), n: n });
  });
  if (!els.some((e) => e.lvl === 3 && A.fns.some((f) => f.el === e.id))) add("err", "c_noFnL3");
  const modes = failsAt(A, 2);
  if (!modes.length) add("err", "c_noFail");
  if (modes.length > LIM.modes) add("warn", "c_manyModes", { n: modes.length, max: LIM.modes });
  modes.forEach((m) => {
    const ne = effectsOf(A, m.id).length;
    if (!ne) add("err", "c_modeNoEff", { m: short(m.text) });
    if (ne > LIM.effects) add("warn", "c_manyEff", { m: short(m.text), n: ne, max: LIM.effects });
    const cs = causesOf(A, m.id);
    if (!cs.length) add("err", "c_modeNoCause", { m: short(m.text) });
    if (cs.length > LIM.causes) add("warn", "c_manyCause", { m: short(m.text), n: cs.length, max: LIM.causes });
    cs.forEach((c) => {
      const ev = evalRisk(A, m.id, c.id); const r = ev.r; const o = { m: short(m.text), c: short(c.text) };
      if (!r.o) add("err", "c_noO", o);
      if (!r.d) add("err", "c_noD", o);
      if (!(r.pc || []).length) add("warn", "c_noPC", o);
      if (!(r.dc || []).length) add("warn", "c_noDC", o);
      if ((ev.ap0 === "H" || ev.ap0 === "M") && !(r.acts || []).length) add("err", "c_noRev", Object.assign({ ap: ev.ap0 }, o));
      if ((r.acts || []).length && (!r.o2 || !r.d2)) add("err", "c_revOD", o);
      if ((r.acts || []).some((a) => !a.text || !a.resp || !a.due)) add("warn", "c_actInc", o);
      (r.acts || []).forEach((a) => {
        if (a.status !== "done") return;
        const ao = Object.assign({ a: short(a.text || "–") }, o);
        if (!a.result) add("warn", "c_noResult", ao);
      });
      if (ev.failOpen) add("err", "c_failAct", o);
      if (ev.extraNeeded && !r.xt) add("err", "c_noExtra", Object.assign({ ap: ev.ap1 }, o));
      if (ev.extraNeeded && r.xt && r.xtype === "P" && !r.xo) add("err", "c_extraO", o);
      if (ev.extraNeeded && r.xt && r.xtype !== "P" && !r.xd) add("err", "c_extraD", o);
      if ((ev.fin === "H" || ev.fin === "M") && ev.apX && !r.resid) add("err", "c_noResid", Object.assign({ ap: ev.fin }, o));
    });
  });
  failsAt(A, 1).forEach((e) => {
    if (!A.links.some((l) => l[1] === e.id)) add("warn", "c_orphanE", { e: short(e.text) });
    else if (!e.s) add("err", "c_noS", { e: short(e.text) });
  });
  failsAt(A, 3).forEach((c) => {
    if (!A.links.some((l) => l[1] === c.id)) add("warn", "c_orphanC", { c: short(c.text) });
    if (kind === "hw" && !(c.comp || []).length) add("warn", "c_noComp", { c: short(c.text) });
  });
  return out;
}

      const acts = (r.acts || []).map((a) => "[" + a.type + "] " + esc(a.text) + (a.resp ? " · " + esc(a.resp) : "") + (a.due ? " · " + esc(a.due) : "") + " · " + esc(t(a.status === "done" ? "stDone" : a.status === "progress" ? "stProg" : "stPlanned")) + (a.status === "done" && a.result ? ' · <b class="' + (a.result === "pass" ? "L" : "H") + '">' + a.result.toUpperCase() + "</b>" : "")).join("<br>");
      rows += "<tr><td>" + effs.map((e) => esc(e.text) + " (S " + (e.s || "–") + ")").join("<br>") + "</td><td>" + (ev.s || "–") + "</td><td>" + esc(m.text) + "</td><td><i>" + esc(elOfFail(kind, c) + culOf(c)) + "</i><br>" + esc(c.text) + "</td><td>" + (r.pc || []).map(esc).join("<br>") + "</td><td>" + (r.o || "–") +
        "</td><td>" + (r.dc || []).map(esc).join("<br>") + "</td><td>" + (r.d || "–") + '</td><td class="' + (ev.ap0 || "") + '">' + (ev.ap0 || "–") + "</td><td>" + (acts || "–") + "</td><td>" + (r.o2 || "–") + "</td><td>" + (r.d2 || "–") + '</td><td class="' + (ev.ap1 || "") + '">' + (ev.ap1 || "–") +
        "</td><td>" + (r.xt ? "[" + (r.xtype === "P" ? "P" : "D") + "] " + esc(r.xt) + (r.xtype === "P" ? (r.xo ? " (O " + r.xo + ")" : "") : (r.xd ? " (D " + r.xd + ")" : "")) + (r.resid ? "<br><i>" + esc(r.resid) + "</i>" : "") : "–") + '</td><td class="' + (ev.fin || "") + '">' + (ev.fin || "–") + "</td></tr>";
      text.push("FM: " + m.text + " | FE: " + effs.map((e) => e.text + " (S " + (e.s || "-") + ")").join("; ") + " | FC: [" + elOfFail(kind, c) + culOf(c) + "] " + c.text + " | PC: " + (r.pc || []).join("; ") + " | O=" + (r.o || "-") + " | DC: " + (r.dc || []).join("; ") + " | D=" + (r.d || "-") +
        " | AP=" + (ev.ap0 || "-") + " | rev: " + (r.acts || []).map((a) => "[" + a.type + "] " + a.text + " / " + a.resp + " / " + a.due + " / " + a.status + (a.status === "done" && a.result ? " / " + a.result.toUpperCase() : "")).join("; ") + " O'=" + (r.o2 || "-") + " D'=" + (r.d2 || "-") + " AP'=" + (ev.ap1 || "-") +
        " | extra: [" + (r.xtype === "P" ? "P" : "D") + "] " + (r.xt || "-") + (r.xtype === "P" ? " O=" + (r.xo || "-") : " D=" + (r.xd || "-")) + " | AP final=" + (ev.fin || "-") + (r.resid ? " | residual: " + r.resid : ""));
      if (ev.s && r.o && r.d) {
        const ki = sBand(ev.s) + "|" + oBand(+r.o) + "|" + dIdx(+r.d); cnt.i[ki] = (cnt.i[ki] || 0) + 1; sum.i[ev.ap0]++;
        const o1 = ev.hasRev ? +r.o2 : +r.o; const d1 = ev.apX ? Math.min(ev.hasRev ? +r.d2 : +r.d, +r.xd) : ev.hasRev ? +r.d2 : +r.d;
        const kf = sBand(ev.s) + "|" + oBand(o1) + "|" + dIdx(d1); cnt.f[kf] = (cnt.f[kf] || 0) + 1; sum.f[ev.fin]++;
      }
    });
  });
  parts.push("<h3>" + esc(t("form")) + '</h3><table class="r">' + head + rows + "</table>");
  const mx = '<table class="r mx"><tr><th>S</th><th>O</th><th>D 1</th><th>D 2–4</th><th>D 5–6</th><th>D 7–10</th></tr>' + SB.map((sb) => OB.map((ob, oi) => "<tr>" + (oi === 0 ? '<th rowspan="5">' + sb + "</th>" : "") + "<th>" + ob + "</th>" + [3, 2, 1, 0].map((di) => {
    const a = AP[sb][ob][di]; const k = sb + "|" + ob + "|" + di; const i = cnt.i[k] || 0, f = cnt.f[k] || 0;
    return '<td class="' + a + '">' + (i || f ? i + " / " + f : "") + "</td>";
  }).join("") + "</tr>").join("")).join("") + "</table>";
  parts.push("<h3>" + esc(t("matrix")) + "</h3>" + mx);
  parts.push("<p><b>" + esc(t("sumR")) + ":</b> " + esc(t("initial")) + " H " + sum.i.H + " · M " + sum.i.M + " · L " + sum.i.L + " — " + esc(t("final")) + " H " + sum.f.H + " · M " + sum.f.M + " · L " + sum.f.L + "</p>");
  text.push(t("sumR") + ": " + t("initial") + " H " + sum.i.H + " M " + sum.i.M + " L " + sum.i.L + " / " + t("final") + " H " + sum.f.H + " M " + sum.f.M + " L " + sum.f.L);
  const c = checks(kind);
  parts.push("<h3>" + esc(t("checks")) + "</h3>" + (c.length ? "<ul>" + c.map((x) => "<li>[" + esc(t(x.sev)) + "] " + esc(x.msg) + "</li>").join("") + "</ul>" : "<p>" + esc(t("noIssues")) + "</p>"));
  text.push(t("checks") + ": " + (c.length ? c.map((x) => "[" + t(x.sev) + "] " + x.msg).join(" | ") : t("noIssues")));
  return parts.join("\n");
}
function buildReport() {
  const date = new Date(); const text = [];
  let body = "<h1>" + esc(t("reportTitle")) + "</h1><p><b>" + t("student") + ":</b> " + esc(S.name || "–") + " · <b>" + t("variant") + ":</b> " + esc(S.variant) +
    " · <b>" + t("generated") + ":</b> " + date.toLocaleString(LANG === "ro" ? "ro-RO" : "en-GB") + "</p>";
  text.push(t("reportTitle"), t("student") + ": " + (S.name || "–") + " | " + t("variant") + ": " + S.variant + " | " + t("generated") + ": " + date.toISOString());
  body += "<h2>" + esc(t("fiveT")) + '</h2><table class="r"><tr><th>' + t("tIntent") + "</th><td>" + esc(fmt(t("vIntent"), { hw: hwLabel(), sw: swLabel() })) + "</td></tr><tr><th>" + t("tTiming") + "</th><td>" + esc(t("vTiming")) +
    "</td></tr><tr><th>" + t("tTeam") + "</th><td>" + esc(fmt(t("vTeam"), { name: S.name || "–" })) + "</td></tr><tr><th>" + t("tTask") + "</th><td>" + esc(t("vTask")) + "</td></tr><tr><th>" + t("tTools") + "</th><td>" + esc(t("vTools")) + "</td></tr></table>";
  body += analysisReport("hw", text) + analysisReport("sw", text);
  body += "<h2>" + esc(t("conclusion")) + "</h2><p>" + esc(S.conclusion || "–").replace(/\n/g, "<br>") + "</p>";
  text.push("", t("conclusion") + ": " + (S.conclusion || "–"));
  const css = "body{font:13px/1.5 Arial,Helvetica,sans-serif;color:#17202D;max-width:1300px;margin:24px auto;padding:0 16px}h1{font-size:21px}h2{font-size:17px;margin-top:26px;border-bottom:1px solid #D9DEE7;padding-bottom:4px}h3{font-size:14px;margin:16px 0 6px}" +
    "table.r{border-collapse:collapse;font-size:12px}table.r th,table.r td{border:1px solid #D9DEE7;padding:3px 6px;text-align:left;vertical-align:top}table.r th{background:#F3F5F8}.H{background:#FBE6E6;font-weight:bold}.M{background:#FAEFD8;font-weight:bold}.L{background:#DFF2E8}" +
    ".fn{color:#1D7F54}.fl{color:#B83434}.chain{display:grid;grid-template-columns:1fr 24px 1fr 24px 1fr;gap:6px;align-items:center;margin:8px 0 14px}.chain .box{border:1px dashed #D9DEE7;border-radius:4px;padding:4px 6px;margin:3px 0}.chain .box.m{border:1px solid #B79A10;background:#FFF6BF}.arr{text-align:center;color:#5B6578}.mx td{width:46px;height:24px;text-align:center}";
  const html = '<!doctype html><html lang="' + LANG + '"><head><meta charset="utf-8"><title>DFMEA ' + esc(S.variant) + " " + esc(S.name) + "</title><style>" + css + "</style></head><body>" + body + "</body></html>";
  return { html: html, body: body, text: text.join("\n") };
}
function renderReport(view) {
  const r = buildReport();
  view.innerHTML = '<div class="row between"><h2>' + esc(t("reportTitle")) + '</h2><div class="row"><button class="btn primary" id="dl" type="button">' + esc(t("download")) + '</button><button class="btn" id="cp" type="button">' + esc(t("copy")) + "</button></div></div>" +
    '<p class="muted">' + esc(t("reportHint")) + '</p><div class="panel stack"><label class="label" for="conclusion">' + esc(t("conclusion")) + '</label><textarea class="in" id="conclusion">' + esc(S.conclusion) + "</textarea></div>" +
    '<div id="sendBox"></div><div class="report-frame" id="rframe">' + r.body + '</div><textarea class="in" id="reportText" readonly hidden></textarea>';
  if (window.LabReport) window.LabReport.mount(view.querySelector("#sendBox"), { lab: "FMEA", lang: LANG, getPayload: () => {
    const x = buildReport();
    const sum = ["hw", "sw"].map((k) => { const A = S[k]; const c = { H: 0, M: 0, L: 0 }; let n = 0;
      failsAt(A, 2).forEach((m) => causesOf(A, m.id).forEach((cs) => { n++; const f = evalRisk(A, m.id, cs.id).fin; if (f) c[f]++; }));
      return k.toUpperCase() + ": " + failsAt(A, 2).length + " FM, " + n + " FM-FC, final H " + c.H + " M " + c.M + " L " + c.L + ", checks " + checks(k).length; }).join(" · ");
    return { name: S.name, group: S.group, variant: S.variant, html: x.html, text: x.text, summary: sum };
  } });
  view.querySelector("#conclusion").addEventListener("input", (e) => { S.conclusion = e.target.value; save(); });
  view.querySelector("#conclusion").addEventListener("change", () => { view.querySelector("#rframe").innerHTML = buildReport().body; });
  view.querySelector("#dl").addEventListener("click", () => {
    const b = new Blob([buildReport().html], { type: "text/html" }); const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "DFMEA_" + S.variant + "_" + (S.name || "student").replace(/[^\w\-]+/g, "_") + ".html";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  view.querySelector("#cp").addEventListener("click", () => {
    const txt = buildReport().text; const ta = view.querySelector("#reportText");
    const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast(t("copyFail")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); else fallback();
  });
}

/* ================================================================ boot */
load(); LANG = S.lang || "ro";
if (!S.hw) S.hw = blankA(); if (!S.sw) S.sw = blankA();
document.getElementById("stName").value = S.name; document.getElementById("stVariant").value = S.variant;
document.getElementById("stName").addEventListener("input", (e) => { S.name = e.target.value; save(); });
document.getElementById("studentForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = document.getElementById("stVariant").value.trim().toUpperCase();
  if (!VARIANTS[code]) { toast(t("badVariant")); return; }
  if (S.variant && S.variant !== code) { S.hw = blankA(); S.sw = blankA(); }
  S.variant = code; document.getElementById("stVariant").value = code;
  save(); render(); toast(t("variantLoaded").replace("{v}", code));
});
/* start over: two clicks within 5 s clear this app's saved work */
(function () {
  const b = document.getElementById("resetAll"); let armed = 0, timer = null;
  b.addEventListener("click", () => {
    if (Date.now() - armed < 5000) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ lang: LANG })); } catch (e) { /* storage unavailable */ }
      location.reload(); return;
    }
    armed = Date.now(); b.textContent = t("resetConfirm"); b.classList.add("danger");
    clearTimeout(timer); timer = setTimeout(() => { armed = 0; b.textContent = t("reset"); b.classList.remove("danger"); }, 5000);
  });
})();
document.getElementById("langRo").addEventListener("click", () => { LANG = "ro"; S.lang = "ro"; save(); render(); });
document.getElementById("langEn").addEventListener("click", () => { LANG = "en"; S.lang = "en"; save(); render(); });
render();
</script>
