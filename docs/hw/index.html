<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HW TCA Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../shared/pcb.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: production-test workbench. Header with student/variant, board view with test points
   beside the reference tables, risk sheet (S/O/D per failure mode) and AP summary below. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #17202D; --muted: #5B6578; --line: #D9DEE7;
  --accent: #2443C4; --accent-ink: #FFFFFF; --accent-soft: #E6EBFB; --code-bg: #F9FAFC;
  --ok: #1D7F54; --ok-bg: #DFF2E8; --bad: #B83434; --bad-bg: #FBE6E6; --warn: #9A6514; --warn-bg: #FAEFD8;
  --pcb: #2F6B4F; --pcb-edge: #24533D; --pad: #C9A44C; --silk: #F4F7F2; --part: #1E2630; --tp: #E0A21B;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
    --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
    --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
    --pcb: #22553E; --pcb-edge: #183D2C; --pad: #B8933F; --silk: #E8EEE6; --part: #0B1016; --tp: #E8AE32;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
  --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
  --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
  --pcb: #22553E; --pcb-edge: #183D2C; --pad: #B8933F; --silk: #E8EEE6; --part: #0B1016; --tp: #E8AE32;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); }
.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .sub { font-size: 0.85rem; color: var(--muted); }
.student { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field input, .field select { height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); min-width: 0; }
.field input.w-name { width: 190px; }
.field input.w-small { width: 92px; }
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.btn.small { height: 28px; padding: 0 10px; font-size: 0.85rem; }
.lang, .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lang button, .seg button { border: 0; background: transparent; padding: 0 10px; height: 32px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.lang button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 12px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--muted); white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:disabled { opacity: 0.45; cursor: not-allowed; }
main .wrap { padding-block: 22px 48px; display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 18px; align-items: start; }
@media (max-width: 1050px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.intro { max-width: 72ch; display: flex; flex-direction: column; gap: 12px; }
.ctxbox { border-left: 3px solid var(--accent); }
.ctxbox p { margin-top: 4px; max-width: 110ch; }
details.help summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; }
details.help ol.task { margin: 10px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px; }
table.prov { border-collapse: collapse; font-size: 0.85rem; }
table.prov th { text-align: left; vertical-align: top; padding: 4px 8px 4px 0; white-space: nowrap; }
table.prov td { padding: 4px 0; border-bottom: 1px dashed var(--line); }
table.aiag td { vertical-align: top; font-size: 0.8rem; }
.aiagnote { font-size: 0.78rem; margin-top: 6px; }
ul.checks { margin: 0; padding-left: 1.2em; color: var(--warn); }
td.oc select { max-width: 210px; }
th[title] { cursor: help; text-decoration: underline dotted; text-underline-offset: 3px; }
.stdbox { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 4px; font-size: 0.92rem; }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }

/* board */
.conn .pinrow { display: flex; flex-wrap: wrap; gap: 6px; }
.pinchip { font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; background: var(--surface); cursor: pointer; color: var(--ink); display: inline-flex; gap: 6px; align-items: center; }
.pinchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.pinchip.on { border-color: var(--tp); background: var(--warn-bg); font-weight: 700; }
.pickbtn { font: inherit; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.compchip { font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; background: var(--surface); cursor: pointer; color: var(--ink); }
.compchip.on { border-color: var(--tp); background: var(--warn-bg); font-weight: 700; }
.compchip.out { opacity: 0.55; }
.conn { display: flex; flex-direction: column; gap: 6px; font-size: 0.9rem; }
.conn .cr { display: grid; grid-template-columns: minmax(70px, auto) auto 1fr; gap: 8px; align-items: start; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.conn .cr:last-child { border-bottom: 0; }
.conn .pinl2 { font-family: var(--font-mono); font-size: 0.82rem; }
.conn .to { color: var(--ink); }
.conn .meta { color: var(--muted); font-size: 0.82rem; }
.netchip { display: inline-flex; align-items: center; gap: 5px; font-family: var(--font-mono); font-size: 0.8rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; background: var(--surface); cursor: pointer; color: var(--ink); }
.netchip i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.netchip.on { border-color: var(--ink); font-weight: 700; }
.netchips { display: flex; flex-wrap: wrap; gap: 6px; }
.nets { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.nets label { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 8px; font-family: var(--font-mono); font-size: 0.82rem; cursor: pointer; background: var(--surface); }
.nets label.on { border-color: var(--tp); background: var(--warn-bg); }
.nets label.na { opacity: 0.55; cursor: not-allowed; }
.toggle { display: flex; align-items: center; gap: 8px; font-size: 0.92rem; }
.ftc { display: flex; flex-direction: column; gap: 4px; width: 230px; }
textarea.ftj { width: 100%; min-height: 48px; font-size: 0.8rem; padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); resize: vertical; }
.ftd { display: flex; gap: 6px; align-items: flex-start; }
.ftd .why { max-width: 150px; margin-top: 0; }
details.pts > summary { font-size: 1.05rem; }
details.pts ol { margin: 6px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
table.ptst td { font-size: 0.84rem; }
.pres { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.pres:last-child { border-bottom: 0; }
.pres .rl { font-weight: 600; }
.pmodes { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
table.sheet .ftc select { width: 100%; font-family: var(--font-body); font-size: 0.8rem; }
td.ra { min-width: 210px; }
table.sheet td.ra select { width: 100%; margin-bottom: 4px; font-family: var(--font-body); }
td.ra textarea { min-height: 54px; font-size: 0.82rem; padding: 4px 6px; }
.tests { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.tests li { display: flex; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 4px 4px 10px; font-size: 0.9rem; }
.tests li span:nth-child(2) { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.addtest { display: flex; gap: 8px; flex-wrap: wrap; }
.addtest input { flex: 1 1 220px; height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); min-width: 0; }
.x { border: 0; background: transparent; color: var(--muted); cursor: pointer; width: 26px; height: 26px; border-radius: 4px; font-size: 1rem; flex: none; }
.x:hover { color: var(--bad); background: var(--bad-bg); }

/* sheet */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.sheet { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
table.sheet th { text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; vertical-align: bottom; }
table.sheet td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.sheet tr:last-child td { border-bottom: 0; }
table.sheet tr.sel td { background: var(--accent-soft); }
table.sheet td.eff { min-width: 190px; max-width: 250px; }
table.sheet td.num { font-family: var(--font-mono); text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.sheet td.ref { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; cursor: pointer; }
table.sheet select { height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 0 4px; font-family: var(--font-mono); font-size: 0.82rem; }
.dv { display: inline-block; min-width: 2.2em; padding: 1px 6px; border-radius: 4px; font-weight: 600; }
.dv.d1 { background: var(--ok-bg); color: var(--ok); }
.dv.dm { background: var(--warn-bg); color: var(--warn); }
.dv.d10 { background: var(--bad-bg); color: var(--bad); }
.why { display: block; font-family: var(--font-body); font-size: 0.7rem; color: var(--muted); font-weight: 400; margin-top: 2px; white-space: normal; max-width: 120px; }
.ap { display: inline-block; min-width: 1.8em; text-align: center; border-radius: 4px; font-weight: 700; font-family: var(--font-mono); padding: 1px 6px; }
.ap.H { background: var(--bad-bg); color: var(--bad); }
.ap.M { background: var(--warn-bg); color: var(--warn); }
.ap.L { background: var(--ok-bg); color: var(--ok); }
.ap.na { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.meter { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); }
.meter .val { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter .was { font-family: var(--font-mono); font-size: 0.82rem; color: var(--muted); }
.meter.good .val { color: var(--ok); }
.meter.risk .val { color: var(--bad); }
details.ref { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
details.ref > summary { cursor: pointer; padding: 10px 14px; font-family: var(--font-display); font-weight: 600; }
details.ref > div { padding: 0 14px 14px; overflow-x: auto; }
table.mini { border-collapse: collapse; font-size: 0.84rem; width: 100%; }
table.mini th, table.mini td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
table.mini th { background: var(--bg); font-weight: 600; }
table.mini td.c { text-align: center; font-family: var(--font-mono); font-weight: 600; }
textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 8px 10px; resize: vertical; }
.report-frame { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; overflow-x: auto; }
.report-frame h1 { font-size: 1.35rem; margin-bottom: 6px; }
.report-frame h2 { font-size: 1.05rem; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.report-frame ul { margin: 6px 0; }
.report-frame table.r { border-collapse: collapse; font-size: 0.84rem; }
.report-frame table.r th, .report-frame table.r td { border: 1px solid var(--line); padding: 4px 7px; text-align: left; vertical-align: top; }
.report-frame table.r th { background: var(--bg); font-size: 0.75rem; }
.report-frame .ap-H { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.report-frame .ap-M { background: var(--warn-bg); color: var(--warn); font-weight: 700; }
.report-frame .ap-L { background: var(--ok-bg); color: var(--ok); }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; z-index: 20; max-width: calc(100vw - 32px); }
@media (max-width: 640px) { .student { margin-left: 0; } .field input.w-name { width: 150px; } }
</style>
<link rel="stylesheet" href="../shared/skin.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>HW TCA Lab</h1>
      <span class="sub" data-i18n="subtitle"></span>
    </div>
    <form class="student" id="studentForm" autocomplete="off">
      <div class="field"><label class="label" for="stName" data-i18n="name"></label><input id="stName" class="w-name"></div>
      <div class="field"><label class="label" for="stVariant" data-i18n="variant"></label><input id="stVariant" class="w-small mono" placeholder="H1"></div>
      <button class="btn primary" id="loadVariant" type="submit" data-i18n="load"></button>
      <button class="btn" id="resetAll" type="button" data-i18n="reset"></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langRo" aria-pressed="true">RO</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
    </form>
  </div>
</header>
<nav class="tabs" aria-label="Sections"><div class="wrap" role="tablist" id="tabs"></div></nav>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script src="../report-config.js"></script>
<script src="../report-send.js"></script>
<script src="../shared/pcb.js"></script>
<script src="../shared/aiag.js"></script>
<script>
"use strict";

function apOf(s, o, d) {
  const sb = s >= 9 ? "9-10" : s >= 7 ? "7-8" : s >= 4 ? "4-6" : s >= 2 ? "2-3" : "1";
  const ob = o >= 8 ? "8-10" : o >= 6 ? "6-7" : o >= 4 ? "4-5" : o >= 2 ? "2-3" : "1";

  return AP[sb][ob][di];
}

/* ---------------------------------------------------------------- detection engine */
function pinNumbers(pin) { const m = pin.match(/\d+/g); return m ? m.map(Number) : []; }
function netsFor(m) {
  if (TWO_TERM[m.ref]) return TWO_TERM[m.ref].slice();
  const map = PIN_NETS[m.ref];
  if (m.mode === "Missing") return Object.values(map).filter(Boolean);
  return pinNumbers(m.pin).map((p) => map[p]);
}
function detection(m, env) {
  const cat = CATEGORY[m.type];
  const r = RULES[cat][m.mode];
  const aoi = env.aoiBottom ? r[1] : r[0], axi = r[2];
  const aoiWhy = [CAT_LABEL[cat] + " · " + modeShort(m)];
  if (r[0] !== r[1]) aoiWhy.push(env.aoiBottom ? t("whyAOIb") : t("whyAOItop"));
  aoiWhy.push(tr(r[5]));
  const nets = netsFor(m);
  const noNet = nets.some((n) => n === null);
  const access = !noNet && nets.length > 0 && nets.every((n) => env.tps[n]);
  const ict = access ? r[3] : r[4];
  const ictWhy = noNet ? t("whyNoNet") : (access ? t("whyTP") : t("whyNoTP")) + ": " + nets.join(", ");
  return { aoi: aoi, axi: axi, ict: ict, aoiWhy: aoiWhy.join(" · "), axiWhy: CAT_LABEL[cat] + " · " + modeShort(m), ictWhy: ictWhy };
}
const newTest = (id) => (S.newTests || []).find((x) => x.id === id);
function evalRow(idx, env) {
  const m = MODES[idx]; const u = S.rows[idx] || {};
  const det = detection(m, env);
  const sev = SEVERITY.find((x) => x[0] === u.cls);
  const s = sev ? sev[1] : null;
  const o = u.o ? +u.o : null;
  const ft0 = u.fttest === "none" ? 10 : (u.fttest && u.ft ? +u.ft : null);   /* existing FT1-FT8: student's D with justification */
  const ftN = env.newFT && u.nft && u.nfttest && newTest(u.nfttest) ? +u.nft : null; /* new FT test (improvement) */
  const ft = ft0 && ftN ? Math.min(ft0, ftN) : ft0;
  const d = ft ? Math.min(det.aoi, det.axi, det.ict, ft) : null;
  const ap = (s && o && d) ? apOf(s, o, d) : null;
  return { m: m, det: det, s: s, o: o, ft: ft, ft0: ft0, ftN: ftN, d: d, ap: ap };
}

  return { n: idxs.length, done: done, H: h, M: mm, L: l, res: h + mm, ra: ra, cov: done ? Math.round(100 * l / done) : 0 };
}

      (needsRA(r.ap) ? " | RA: " + (u.rad ? t(u.rad === "acc" ? "raAcc" : "raAct") : "–") + " – " + (u.raw || "–") + " – " + (u.ra || "–") : ""));
    const raTxt = needsRA(r.ap) ? (u.rad ? "<b>" + esc(t(u.rad === "acc" ? "raAcc" : "raAct")) + "</b><br>" : "") + esc(u.raw || "–") + "<br>" + esc(u.ra || "–") : "–";
    return "<tr><td>" + (k + 1) + "</td><td>" + esc(r.m.ref + (r.m.pin === "–" ? "" : " " + r.m.pin)) + "</td><td>" + esc(modeTxt(r.m)) + "</td><td>" + esc(effTxt(r.m)) + "</td><td>" + esc(u.cls || "–") + "</td><td>" + (r.s || "–") +
      "</td><td>" + (r.o || "–") + "</td><td>" + r.det.aoi + "</td><td>" + r.det.axi + "</td><td>" + r.det.ict + "</td><td>" + esc(ftLabel(u)) + " · " + (r.ft0 || "–") + (u.ftj ? "<br><i>" + esc(u.ftj) + "</i>" : "") + "</td><td>" + (r.ftN ? esc(u.nfttest) + " · " + r.ftN : "–") + "</td><td>" + (r.d || "–") +
      '</td><td class="ap-' + (r.ap || "na") + '">' + (r.ap || "–") + "</td><td>" + (r0.ap || "–") + "</td><td>" + raTxt + "</td></tr>";
  }).join("");
  parts.push("<h2>" + t("sheet") + '</h2><table class="r">' + head + rows + "</table>");
  const sum = (x) => t("mDone") + ": " + x.done + "/" + x.n + " · H: " + x.H + " · M: " + x.M + " · L: " + x.L + " · " + t("mRes") + ": " + x.res + " · " + t("mCov") + ": " + x.cov + "%" + (x === now ? " · " + t("mRA") + ": " + x.ra + "/" + x.res : "");
  parts.push("<h2>" + t("summary") + "</h2><ul><li><strong>" + esc(sum(now)) + "</strong></li><li>" + esc(t("before")) + ": " + esc(sum(base)) + "</li></ul>");
  text.push("", t("summary") + ": " + sum(now), t("before") + ": " + sum(base));
  parts.push("<h2>" + esc(t("conclusion")) + "</h2>" + CONCL.map((c) => "<h3>" + esc(t(c[1])) + "</h3><p>" + esc(S.concl[c[0]] || "–").replace(/\n/g, "<br>") + "</p>").join(""));
  text.push("", t("conclusion") + ":"); CONCL.forEach((c) => text.push("  " + t(c[1]) + ": " + (S.concl[c[0]] || "–")));
  const css = "body{font:13px/1.5 Arial,Helvetica,sans-serif;color:#17202D;max-width:1200px;margin:24px auto;padding:0 16px}h1{font-size:21px}h2{font-size:16px;margin-top:20px;border-bottom:1px solid #D9DEE7;padding-bottom:4px}" +
    "table.r{border-collapse:collapse;font-size:12px}table.r th,table.r td{border:1px solid #D9DEE7;padding:3px 6px;text-align:left;vertical-align:top}table.r th{background:#F3F5F8}.ap-H{background:#FBE6E6;font-weight:bold}.ap-M{background:#FAEFD8;font-weight:bold}.ap-L{background:#DFF2E8}";
  const html = '<!doctype html><html lang="' + LANG + '"><head><meta charset="utf-8"><title>HW TCA ' + esc(S.variant) + " " + esc(S.name) + "</title><style>" + css + "</style></head><body>" + parts.join("\n") + "</body></html>";
  return { html: html, body: parts.join("\n"), text: text.join("\n") };
}
/* structured copy of the analysis, sent with the report for scoring against the answer key */
function reportData() {
  const env = ENV_NOW();
  return { variant: S.variant, lang: LANG, aoiBottom: !!S.aoiBottom, tps: Object.keys(S.tps || {}).filter((k) => S.tps[k]), newTests: S.newTests || [], concl: S.concl,
    rows: (V() || []).map((i) => { const r = evalRow(i, env), r0 = evalRow(i, ENV_BASE); const u = S.rows[i] || {};
      return { idx: i, ref: r.m.ref, pin: r.m.pin, mode: r.m.mode, cls: u.cls || "", s: r.s || null, o: r.o || null, aoi: r.det.aoi, axi: r.det.axi, ict: r.det.ict,
        fttest: u.fttest || "", ft: r.ft0 || null, ftj: u.ftj || "", nfttest: u.nfttest || "", nft: r.ftN || null, d: r.d || null, ap: r.ap || "", ap0: r0.ap || "",
        rad: u.rad || "", raw: u.raw || "", ra: u.ra || "", checks: CHECK_KEYS(u, r) }; }),
    checksOpen: checks().length };
}
const CHECK_KEYS = (u, r) => [!u.cls && "cls", !u.o && "o", !u.fttest && "ft", u.fttest && u.fttest !== "none" && !u.ft && "ftd", u.fttest && !(u.ftj || "").trim() && "ftj",
  needsRA(r.ap) && !raDone(u) && "ra"].filter(Boolean);
function checks() {
  const out = [];
  V().forEach((i, k) => {
    const r = evalRow(i, ENV_NOW()); const u = S.rows[i] || {};
    const n = "#" + (k + 1) + " " + r.m.ref + (r.m.pin === "–" ? "" : " " + r.m.pin) + " · " + modeTxt(r.m);
    const f = (key, extra) => out.push(fmtT(key, Object.assign({ n: n }, extra || {})));
    if (!u.cls) f("c_cls"); if (!u.o) f("c_o");
    if (!u.fttest) f("c_ft"); else if (u.fttest !== "none" && !u.ft) f("c_ftd");
    if (u.fttest && !(u.ftj || "").trim()) f("c_ftj");
    if (needsRA(r.ap)) { if (!u.rad) f("c_ra", { ap: r.ap }); else if (!raDone(u)) f("c_raTxt"); }
  });
  CONCL.forEach((c) => { if (!(S.concl[c[0]] || "").trim()) out.push(fmtT("c_conclF", { f: t(c[1]) })); });
  return out;
}
function renderReport(view) {
  const r = buildReport();
  const ck = checks();
  if (window.LabReport) window.LabReport.snapshot("HW-TCA", reportData);
  view.innerHTML = '<div class="row" style="justify-content:space-between"><h2>' + t("reportTitle") + '</h2><div class="row"><button class="btn primary" id="dl" type="button">' + t("download") +
    '</button><button class="btn" id="cp" type="button">' + t("copy") + '</button></div></div><p class="muted">' + t("reportHint") + '</p><div class="panel stack"><h3>' + t("chkTitle") + "</h3>" + (ck.length ? '<ul class="checks">' + ck.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : '<p class="muted">' + t("chkOk") + "</p>") + '</div><div id="sendBox"></div><div class="report-frame">' + r.body + '</div><textarea id="reportText" readonly hidden></textarea>';
  if (window.LabReport) window.LabReport.mount(view.querySelector("#sendBox"), { lab: "HW-TCA", lang: LANG, getPayload: () => {
    const x = buildReport(); const s = summary(ENV_NOW());
    return { name: S.name, group: S.group, variant: S.variant, html: x.html, text: x.text, data: reportData(),
      summary: s.done + "/" + s.n + " · H " + s.H + " · M " + s.M + " · L " + s.L + " · cov " + s.cov + "% · RA " + s.ra + "/" + s.res };
  } });
  view.querySelector("#dl").addEventListener("click", () => {
    const b = new Blob([buildReport().html], { type: "text/html" }); const a = document.createElement("a");
    a.href = URL.createObjectURL(b); a.download = "HW-TCA_" + S.variant + "_" + (S.name || "student").replace(/[^\w\-]+/g, "_") + ".html";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  view.querySelector("#cp").addEventListener("click", () => {
    const txt = buildReport().text; const ta = view.querySelector("#reportText");
    const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast(t("copyFail")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback); else fallback();
  });
}

/* ---------------------------------------------------------------- boot */
load(); LANG = S.lang || "ro";
if (!S.concl) S.concl = { o: "", impr: "", lim: "" };
if ((S.conclusion || "").trim() && !S.concl.impr) { S.concl.impr = S.conclusion; S.conclusion = ""; save(); }  /* single conclusion field before 14 Nov 2026 */
if (window.LabReport) window.LabReport.track("HW-TCA");
document.getElementById("stName").value = S.name; document.getElementById("stVariant").value = S.variant;
document.getElementById("stName").addEventListener("input", (e) => { S.name = e.target.value; save(); });
document.getElementById("studentForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = document.getElementById("stVariant").value.trim().toUpperCase();
  if (!VARIANTS[code]) { toast(t("badVariant")); return; }
  S.variant = code; document.getElementById("stVariant").value = code;
  if (S.tab === "start") S.tab = "analysis";
  save(); render(); toast(t("variantLoaded").replace("{v}", code));
});
/* start over: two clicks within 5 s clear this app's saved work */
(function () {
  const b = document.getElementById("resetAll"); let armed = 0, timer = null;
  b.addEventListener("click", () => {
    if (Date.now() - armed < 5000) {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ lang: LANG })); } catch (e) { /* storage unavailable */ }
      if (window.LabReport) window.LabReport.resetWork("HW-TCA");
      location.reload(); return;
    }
    armed = Date.now(); b.textContent = t("resetConfirm"); b.classList.add("danger");
    clearTimeout(timer); timer = setTimeout(() => { armed = 0; b.textContent = t("reset"); b.classList.remove("danger"); }, 5000);
  });
})();
document.getElementById("langRo").addEventListener("click", () => { LANG = "ro"; S.lang = "ro"; save(); render(); });
document.getElementById("langEn").addEventListener("click", () => { LANG = "en"; S.lang = "en"; save(); render(); });
render();
</script>
