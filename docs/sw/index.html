<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SW TCA Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: test-bench workspace. Header with student/variant, tab rail of exercises,
   requirements + annotated source side by side, test table and coverage readout below. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17202D;
  --muted: #5B6578;
  --line: #D9DEE7;
  --accent: #2443C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFB;
  --code-bg: #F9FAFC;
  --ok: #1D7F54;
  --ok-bg: #DFF2E8;
  --bad: #B83434;
  --bad-bg: #FBE6E6;
  --warn: #9A6514;
  --warn-bg: #FAEFD8;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
    --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
    --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
  --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
  --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
}
.wrap {
  max-width: 1380px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .sub { font-size: 0.85rem; color: var(--muted); }
.student { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field input, .field select { height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); min-width: 0; }
.field input.w-name { width: 190px; }
.field input.w-small { width: 92px; }
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.btn.small { height: 28px; padding: 0 10px; font-size: 0.85rem; }
.btn.ghost { background: transparent; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 0 10px; height: 32px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

/* tabs */
nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 12px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--muted); white-space: nowrap; }
nav.tabs button .num { font-family: var(--font-mono); font-size: 0.8rem; margin-right: 6px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:disabled { opacity: 0.45; cursor: not-allowed; }

main .wrap { padding-block: 22px 48px; display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* intro */
.intro { max-width: 70ch; display: flex; flex-direction: column; gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.step .fn { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.notice.bad { border-left-color: var(--bad); background: var(--bad-bg); }

/* requirements */
.req { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.req:first-child { border-top: 0; }
.req .id { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; color: var(--accent); white-space: nowrap; padding-top: 1px; }
.req .txt { font-size: 0.93rem; }
.req .txt .ro { display: block; color: var(--muted); font-size: 0.86rem; margin-top: 2px; }
.task { font-size: 0.95rem; display: flex; flex-direction: column; gap: 6px; }
.task ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; }
.ctxbox { border-left: 3px solid var(--accent); }
.ctxbox p { margin: 6px 0 0; font-size: 0.95rem; max-width: 110ch; }
details.help > summary { cursor: pointer; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
details.help[open] > summary { margin-bottom: 8px; }
details.help ol.task { margin: 0; padding-left: 1.2em; gap: 5px; }
table.prov { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
table.prov th { text-align: left; vertical-align: top; font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; padding: 6px 10px 6px 0; white-space: nowrap; color: var(--accent); }
table.prov td { padding: 6px 0; border-top: 1px solid var(--line); }
table.prov tr:first-child td { border-top: 0; }
@media (max-width: 720px) { table.prov th { white-space: normal; } }
.meter[title], .legend [title], tr.ctx[title], table.tests th[title] { cursor: help; }
table.tests th[title] { text-decoration: underline dotted; text-underline-offset: 3px; }
.code td.src.hasprov { text-decoration: underline dotted; text-underline-offset: 3px; }

/* code */
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; font-family: var(--font-mono); font-size: 0.83rem; line-height: 1.6; }
.code table { border-collapse: collapse; width: 100%; }
.code td { padding: 0 10px; white-space: pre; vertical-align: top; }
.code td.n { color: var(--muted); text-align: right; width: 1%; user-select: none; border-right: 1px solid var(--line); }
.code td.h { text-align: right; width: 1%; user-select: none; color: var(--muted); }
.code td.d { width: 1%; user-select: none; }
.code tr.ctx td { color: var(--muted); }
.code tr.hit td.src { background: var(--ok-bg); }
.code tr.miss td.src { background: var(--bad-bg); }
.code tr.part td.src { background: var(--warn-bg); }
.code tr.miss td.h { color: var(--bad); font-weight: 600; }
.code .sep td { height: 8px; border-bottom: 1px dashed var(--line); }
.tf { display: inline-flex; gap: 3px; }
.tf span { display: inline-block; min-width: 1.5em; text-align: center; border-radius: 3px; font-size: 0.72rem; font-weight: 600; line-height: 1.5; padding: 0 3px; }
.tf .y { background: var(--ok-bg); color: var(--ok); }
.tf .n0 { background: var(--bad-bg); color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; }

/* tests */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.tests { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.tests th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
table.tests td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tests tr:last-child td { border-bottom: 0; }
table.tests input, table.tests select { height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 0 6px; font-family: var(--font-mono); font-size: 0.85rem; }
table.tests input { width: 108px; }
table.tests input.invalid { border-color: var(--bad); background: var(--bad-bg); }
table.tests td.tid { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
table.tests td.act { font-family: var(--font-mono); white-space: nowrap; }
table.tests th .thsub { text-transform: none; letter-spacing: 0; font-weight: 400; font-size: 0.7rem; margin-top: 2px; line-height: 1.3; }
table.tests .hint { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); max-width: 140px; margin-top: 3px; line-height: 1.3; min-height: 0; }
table.tests .hint:empty { display: none; }
table.tests tr.haswarn td { border-bottom: 0; }
table.tests tr.warnrow td { padding: 0 8px 10px; font-size: 0.82rem; color: var(--warn); }
table.tests tr.warnrow td div { background: var(--warn-bg); border-radius: 4px; padding: 5px 8px; margin-top: 4px; }
.xbtn { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 1.1rem; padding: 0 4px; }
.xbtn:hover { color: var(--bad); }

/* metrics */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.meter { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.meter .val { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter .frac { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--warn); }
.meter.full .bar > i { background: var(--ok); }
.meter.full .val { color: var(--ok); }
.meter.part .val { color: var(--warn); }
.meter.zero .val { color: var(--bad); }
.meter.zero { border-color: var(--bad); }
.thrwarn { border: 1px solid var(--warn); background: var(--warn-bg); color: var(--text); border-radius: var(--radius); padding: 10px 14px; margin: 12px 0 0; font-size: 0.92rem; }
.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.findings ul { margin: 6px 0 0; padding-left: 1.1em; font-size: 0.9rem; display: flex; flex-direction: column; gap: 3px; }
table.tt { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.82rem; margin-top: 6px; }
table.tt th, table.tt td { border: 1px solid var(--line); padding: 3px 8px; text-align: center; white-space: nowrap; }
table.tt th { background: var(--bg); font-weight: 600; }
table.tt td.c-y { color: var(--ok); }
table.tt td.c-n { color: var(--bad); }
.condlist { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 0.88rem; }
.condlist div { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 8px 10px; resize: vertical; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.formgrid .field input, .formgrid .field select { width: 100%; }
.report-frame { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; overflow-x: auto; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.35s ease; } }
@media (max-width: 640px) {
  .student { margin-left: 0; }
  .field input.w-name { width: 150px; }
}
</style>
<link rel="stylesheet" href="../shared/skin.css">
<script src="../shared/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>SW TCA Lab</h1>
      <span class="sub" data-i18n="subtitle"></span>
    </div>
    <form class="student" id="studentForm" autocomplete="off">
      <div class="field"><label class="label" for="stName" data-i18n="name"></label><input id="stName" class="w-name"></div>
      <div class="field"><label class="label" for="stVariant" data-i18n="variant"></label><input id="stVariant" class="w-small mono" placeholder="V1"></div>
      <button class="btn primary" id="loadVariant" type="submit" data-i18n="load"></button>
      <button class="btn" id="resetAll" type="button" data-i18n="reset"></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langRo" aria-pressed="true">RO</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
    </form>
  </div>
</header>
<nav class="tabs" aria-label="Exercises">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

<script src="../report-config.js"></script>
<script src="../report-send.js"></script>
<script>

/* small reading aids under the numeric inputs: decimal value, physical value and position relative to the limits */
function relTo(n, lim, label) { return (n < lim ? "< " : n === lim ? "= " : "> ") + label; }
function inputHint(exKey, k, raw, v) {
  const ex = EX[exKey]; const f = ex.inputs.find((x) => x.k === k);
  const n = parseNum(raw[k], f.type); if (n === null) return "";
  const s = SIGNALS[v.sig];
  if (k === "id") return "= " + dec(n) + " · " + relTo(n, 0x7FF, "0x7FF") + " · " + relTo(n, 0x1FFFFFFF, "0x1FFFFFFF");
  if (k === "dlc") return relTo(n, 8, "8");
  if (k === "tec") return relTo(n, 127, "127") + " · " + relTo(n, 255, "255");
  if (k === "rec") return relTo(n, 127, "127");
  if (k === "value" || k === "previous") {
    let h = "= " + phys(n, v.sig);
    if (k === "value") h += " · " + (n < s.min ? "< min" : n === s.min ? "= min" : n > s.max ? "> max" : n === s.max ? "= max" : L("în domeniu", "in range"));
    if (k === "previous") {
      const val = parseNum(raw.value, "i16");
      if (val !== null) { const d = Math.abs(val - n); h += " · |Δ| = " + d + " " + relTo(d, s.step, s.step + " (" + L("pas max", "max step") + ")"); }
    }
    return h;
  }
  return "";
}

const STORE_KEY = "swtca-lab-v1";

/* work history for the graded report: runs and distinct test versions that drew a warning */
function histOf(exKey) {
  if (!S.hist) S.hist = {};
  const hv = S.hist[S.variant] || (S.hist[S.variant] = {});
  return hv[exKey] || (hv[exKey] = { runs: 0, warned: [] });
}
function recordRun(exKey) {
  const h = histOf(exKey); h.runs++;
  const an = analyse(exKey, V(), S.tests[exKey]);
  an.rows.forEach((r, i) => {
    if (!r.chk || !r.chk.warnings.length) return;
    const tst = S.tests[exKey][i];
    const key = tst.id + "|" + JSON.stringify(tst.inputs) + "|" + tst.expected + "|" + tst.req;
    if (h.warned.indexOf(key) < 0 && h.warned.length < 500) h.warned.push(key);
  });
}
const bugTab = () => (V() && V().f1bug ? "f1" : "f3");  /* the tab that holds the planted bug */
/* Retest of the proposed fix (ISO 26262-8 change management: a change is verified again). The corrected line the
   student wrote is read (comparison operators, and for F1 the returned value), the function is run with it on the
   student's own valid tests, and the result is shown. "spec" (the fix equals the requirement) goes only into the data. */
const OPS = { ">": (a, b) => a > b, ">=": (a, b) => a >= b, "<": (a, b) => a < b, "<=": (a, b) => a <= b, "==": (a, b) => a === b, "!=": (a, b) => a !== b };
const OPRE = "(>=|<=|==|!=|>|<)";
const fmt = (str, o) => str.replace(/\{(\w+)\}/g, (m, k) => (k in o ? o[k] : m));
function fixCheck() {
  const v = V(); const txt = ((S.bug && S.bug.fix) || "").replace(/\s+/g, " ").trim();
  if (!v || !txt) return null;
  const k = bugTab(); let run = null, spec = false;
  if (k === "f1") {
    const m = txt.match(new RegExp("\\bid " + "?" + OPRE + " ?(max_id|CAN_STD_ID_MAX|CAN_EXT_ID_MAX)", "i"));
    if (m) {
      const rhs = m[2].toLowerCase(); const r = txt.match(/return (true|false)/i); const ret = r ? r[1].toLowerCase() === "true" : false;
      run = (i) => { if (i.dlc > 8) return "false"; const lim = rhs === "max_id" ? (i.extended ? 0x1FFFFFFF : 0x7FF) : rhs === "can_std_id_max" ? 0x7FF : 0x1FFFFFFF;
        return OPS[m[1]](i.id, lim) ? String(ret) : "true"; };
      spec = m[1] === ">" && rhs === "max_id" && !ret;
    }
  } else {
    const o = f3Ops(v); let hit = false;
    const pick = (name, lim) => { const m = txt.match(new RegExp("\\b" + name + " ?" + OPRE + " ?(" + lim + ")u?\\b", "i")); if (m) hit = true; return m ? m[1] : null; };
    const bo = pick("tec", "CAN_BUSOFF_LIMIT|255") || o.busoff, tp = pick("tec", "CAN_PASSIVE_LIMIT|127") || o.tecP, rp = pick("rec", "CAN_PASSIVE_LIMIT|127") || o.recP;
    if (hit) {
      run = (i) => (OPS[bo](i.tec, 255) ? "BUS_OFF" : (OPS[tp](i.tec, 127) || OPS[rp](i.rec, 127)) ? "ERROR_PASSIVE" : "ERROR_ACTIVE");
      spec = bo === ">" && tp === ">" && rp === ">";
    }
  }
  if (!run) return { parsed: false };
  const an = analyse(k, v, S.tests[k]);
  const rows = an.rows.filter((r) => !r.bad && r.verdict !== "none" && r.chk.expOk);   /* tests whose expected result follows the requirements */
  const failed = rows.filter((r) => { const t0 = S.tests[k].find((x) => x.id === r.id); return run(r.vals) !== t0.expected; }).map((r) => r.id);
  return { parsed: true, total: rows.length, pass: rows.length - failed.length, failed: failed, spec: spec };
}
function fixMsg() {
  const c = fixCheck(); if (!c) return "";
  const cls = !c.parsed || !c.total ? "warn" : c.failed.length ? "bad" : "ok";
  const msg = !c.parsed ? t("fixUnparsed") : !c.total ? t("fixNone") : c.failed.length ? fmt(t("fixFail"), { p: c.pass, n: c.total, ids: c.failed.join(", ") }) : fmt(t("fixPass"), { n: c.total });
  return '<span style="color:var(--' + cls + ')">' + esc(msg) + "</span>";
}
const fixOk = () => { const c = fixCheck(); return !!(c && c.parsed && c.total && !c.failed.length); };

}

function renderResults(exKey, an) {
  if (!an) return '<p class="muted">' + esc(t("notRun")) + "</p>";
  const ex = EX[exKey];
  let html = '<div class="meters">' + meter(t("mStmt"), an.stmt, "mStmt") + meter(t("mDec"), an.dec, "mDec") + meter(t("mMcdc"), an.mcdc, "mMcdc") + meter(t("mReq"), an.req, "mReq");
  if (an.thr) html += meter(t("mThr"), [an.thr.filter((x) => x.at && x.over).length, an.thr.length], "mThr");
  if (exKey === "int") {
    html += meter(t("mFunc"), [ex.funcs.filter((f) => an.funcs.has(f)).length, ex.funcs.length], "mFunc");
    html += meter(t("mCall"), [ex.calls.filter((c) => an.calls.has(c[0])).length, ex.calls.length], "mCall");
  }
  html += "</div>";
  /* coverage complete but limits not: the most misleading state, say it plainly */
  if (an.thr) {
    const done = an.thr.filter((x) => x.at && x.over).length;
    const covFull = an.stmt[0] === an.stmt[1] && an.dec[0] === an.dec[1];
    if (done < an.thr.length && covFull) {
      html += '<p class="thrwarn">⚠ ' + esc(t("thrWarn").replace("{n}", an.thr.length - done).replace("{m}", an.thr.length)) +
        (!isDemo() && exKey === "f3" ? " " + esc(t("thrWarnF3")) : "") + "</p>";
    }
  }
  html += '<p class="muted" style="font-size:0.8rem;margin:8px 0 0">' + esc(t("target")) + "</p>";
  const unl = an.stmtLines.filter((n) => an.hits[n] === 0);
  const miss = [];
  an.decisions.forEach((d) => d.missing.forEach((o) => miss.push(t("line") + " " + d.line + ": " + (o === true ? "true" : o === false ? "false" : o))));
  const singles = an.decisions.filter((d) => d.conds.length === 1 && !d.conds[0].shown);
  html += '<div class="findings">' +
    "<div><h3>" + t("uncoveredLines") + "</h3><ul>" + (unl.length ? unl.map((n) => "<li>" + t("line") + " " + n + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>" +
    "<div><h3>" + t("missingOutcomes") + "</h3><ul>" + (miss.length ? miss.map((m) => "<li>" + esc(m) + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>" +
    "<div><h3>" + t("reqMissing") + "</h3><ul>" + (an.reqMissing.length ? an.reqMissing.map((r) => '<li class="mono">' + r + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>";
  if (an.thr) html += "<div><h3>" + t("thrTitle") + "</h3><ul>" + an.thr.map((x) => '<li><span class="mono">' + esc(isDemo() ? x.name : x.generic) + "</span> " +
    '<span class="chip ' + (x.at ? "ok" : "bad") + '">' + t("thrAt") + (x.at ? " ✓" : " ✗") + '</span> <span class="chip ' + (x.over ? "ok" : "bad") + '">' + t("thrOver") + (x.over ? " ✓" : " ✗") + "</span></li>").join("") + '</ul><p class="muted" style="font-size:0.82rem;margin:6px 0 0">' + esc(t("bvaHow")) + (isDemo() ? "" : " " + esc(t("thrHidden"))) + "</p></div>";
  html += "<div><h3>" + t("warnTitle") + "</h3><ul>" + (an.warned.length ? an.warned.map((r) => '<li><span class="mono">' + esc(r.id) + "</span>: " +
    r.chk.warnings.length + " " + t(r.chk.warnings.length === 1 ? "warnOne" : "warnMany") + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>";
  if (singles.length) html += "<div><h3>MC/DC · " + t("notShown") + "</h3><ul>" + singles.map((d) => '<li><span class="mono">' + esc(d.conds[0].label) + "</span> (" + t("line") + " " + d.line + ")</li>").join("") + "</ul></div>";
  html += "</div>";
  const tts = an.decisions.map(truthTable).filter(Boolean).join("");
  if (tts) html += '<div class="findings">' + tts + "</div>";
  if (exKey === "int") {
    html += "<div><h3>" + t("funcTitle") + '</h3><div class="row" style="margin-top:6px">' +
      ex.funcs.map((f) => '<span class="chip ' + (an.funcs.has(f) ? "ok" : "bad") + '"><span class="mono">' + f + "()</span> " + (an.funcs.has(f) ? t("called") : t("notCalled")) + "</span>").join("") + "</div>" +
      '<div class="row" style="margin-top:8px">' + ex.calls.map((c) => '<span class="chip ' + (an.calls.has(c[0]) ? "ok" : "bad") + '">' + t("line") + " " + c[1] + ": <span class=\"mono\">" + c[2] + "</span> " + (an.calls.has(c[0]) ? t("exec") : t("notExec")) + "</span>").join("") + "</div></div>";
  }
  return html;
}

const ANALYSIS = {};
/* one example test per tab, added once per variant when the tab has no tests */
function seedExample(exKey) {
  const ex = EX[exKey]; if (!ex.example) return;
  if (!S.seeded) S.seeded = {};
  const key = S.variant + ":" + exKey;
  if (S.seeded[key] || S.tests[exKey].length) { S.seeded[key] = true; return; }
  const e = resolve(ex.example, V());
  S.tests[exKey].push({ id: nextId(exKey), inputs: Object.assign({}, e.inputs), expected: e.expected, req: e.req, example: true });
  S.seeded[key] = true; save();
}
function helpBlocks(exKey) {
  const v = V(); const h = HELP[exKey];
  const how = HX(h.how(isDemo(), SIGNALS[v.sig]));
  const prov = h.prov(v).map((p) => "<tr><th>" + esc(HX(p[0])) + "</th><td>" + esc(HX(p[1])) + "</td></tr>").join("");
  return {
    context: '<div class="panel ctxbox"><span class="label">' + t("ctxTitle") + "</span><p>" + esc(HX(h.context)) + "</p></div>",
    how: '<details class="panel help"' + (isDemo() ? " open" : "") + '><summary>' + t("howTitle") + '</summary><ol class="task">' + how.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ol></details>",
    prov: '<details class="panel help"><summary>' + t("provTitle") + '</summary><table class="prov">' + prov + "</table></details>"
  };
}
function renderExercise(view, exKey) {
  const ex = EX[exKey]; const v = V();
  seedExample(exKey);
  const hb = helpBlocks(exKey);
  const an = S.ran[exKey] ? analyse(exKey, v, S.tests[exKey]) : null;
  ANALYSIS[exKey] = an;
  const reqs = ex.reqs(v).map((r) => '<div class="req"><span class="id">' + r[0] + '</span><span class="txt">' + esc(r[1]) +
    (LANG === "ro" ? '<span class="ro">' + esc(reqRo(r[0], v)) + "</span>" : "") + "</span></div>").join("");
  view.innerHTML =
    '<div class="row" style="justify-content:space-between"><h2><span class="mono" style="color:var(--accent)">' + ex.fn + '()</span></h2>' +
    '<span class="chip">ASIL B · ' + esc(S.variant) + "</span></div>" +
    hb.context +
    (exKey === "f1" ? asilBlock() : "") +
    '<div class="grid2">' +
      '<div class="stack"><div class="panel stack"><span class="label">' + t("task") + '</span><div class="task"><ol>' + t(ex.task).map((s) => "<li>" + esc(s) + "</li>").join("") + "</ol></div></div>" +
      hb.how +
      '<div class="panel"><span class="label">' + t("requirements") + "</span>" + reqs + "</div></div>" +
      '<div class="stack"><div class="panel stack"><span class="label">' + t("code") + " · can_node.c</span>" + renderCode(exKey, an) + "</div>" + hb.prov + "</div>" +
    "</div>" +
    '<div class="panel stack"><div class="row" style="justify-content:space-between"><h3>' + t("tests") + '</h3><div class="row">' +
      '<button class="btn" id="addTest" type="button">+ ' + t("addTest") + '</button><button class="btn primary" id="runTests" type="button">▶ ' + t("run") + "</button></div></div>" +
      '<p class="notice" id="staleNote" hidden>' + esc(t("stale")) + "</p>" +
      renderTests(exKey, an) + "</div>" +
    '<div class="panel stack"><h3>' + t("results") + "</h3>" + renderResults(exKey, an) + "</div>" +
    (exKey === bugTab() ? bugBlock() : "") + (exKey === "int" ? justBlock() : "") +
    '<div class="panel stack"><label class="label" for="notes_' + exKey + '">' + t("notes") + '</label><textarea id="notes_' + exKey + '" data-notes="' + exKey + '">' + esc(S.notes[exKey]) + "</textarea></div>";

  /* events */
  view.querySelector("#addTest").addEventListener("click", () => {
    S.tests[exKey].push({ id: nextId(exKey), inputs: blankInputs(ex), expected: "", req: "" }); save(); render();
  });
  view.querySelector("#runTests").addEventListener("click", () => { S.ran[exKey] = true; recordRun(exKey); save(); render(); });
  view.querySelectorAll("[data-ex][data-i]").forEach((n) => {
    n.addEventListener("change", () => {
      const tst = S.tests[exKey][+n.dataset.i];
      if (n.dataset.k === "__exp") tst.expected = n.value;
      else if (n.dataset.k === "__req") tst.req = n.value;
      else tst.inputs[n.dataset.k] = n.value;
      tst.example = false; save();
      if (S.ran[exKey]) view.querySelector("#staleNote").hidden = false;
    });
    /* live reading aids: recompute every hint of the edited row */
    n.addEventListener("input", () => {
      const i = +n.dataset.i; const tst = S.tests[exKey][i];
      if (n.dataset.k.indexOf("__") !== 0) tst.inputs[n.dataset.k] = n.value;
      view.querySelectorAll('[data-hint^="' + i + ':"]').forEach((h) => { h.textContent = inputHint(exKey, h.dataset.hint.split(":")[1], tst.inputs, V()); });
    });
  });
  view.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => {
    S.tests[exKey].splice(+b.dataset.del, 1); save(); render();
  }));
  view.querySelectorAll("[data-notes]").forEach((n) => n.addEventListener("input", () => { S.notes[exKey] = n.value; save(); }));
  view.querySelectorAll("[data-asil]").forEach((n) => n.addEventListener("change", () => { S.asil[n.dataset.asil] = n.value; save(); }));
  view.querySelectorAll("[data-bug]").forEach((n) => n.addEventListener("input", () => { S.bug[n.dataset.bug] = n.value; save(); const fc = view.querySelector("#fixChk"); if (fc) fc.innerHTML = fixMsg(); }));
  view.querySelectorAll("[data-just]").forEach((n) => n.addEventListener("input", () => { S.just = n.value; save(); }));
}

      text.push("  " + tst.id + ": " + ex.inputs.map((f) => f.k + "=" + tst.inputs[f.k]).join(", ") + " | exp=" + (tst.expected || "–") + " | req=" + (tst.req || "–") + " | act=" + (r.bad ? "–" : r.actual) + " | " + verdict);

    text.push("");
  });
  parts.push("<h2>" + esc(t("conclusion")) + "</h2>" + CONCL.map((c) => "<h3>" + esc(t(c[1])) + "</h3><p>" + esc(S.concl[c[0]] || "–").replace(/\n/g, "<br>") + "</p>").join(""));
  text.push(t("conclusion") + ":"); CONCL.forEach((c) => text.push("  " + t(c[1]) + ": " + (S.concl[c[0]] || "–")));
  const css = "body{font:14px/1.5 Arial,Helvetica,sans-serif;color:#17202D;max-width:1000px;margin:24px auto;padding:0 16px}h1{font-size:22px}h2{font-size:17px;margin-top:22px;border-bottom:1px solid #D9DEE7;padding-bottom:4px}h3{font-size:14px}" +
    "table.r{border-collapse:collapse;font-family:Consolas,monospace;font-size:12px}table.r th,table.r td{border:1px solid #D9DEE7;padding:3px 6px;text-align:left}table.r th{background:#F3F5F8}";
  const html = '<!doctype html><html lang="' + LANG + '"><head><meta charset="utf-8"><title>SW TCA ' + esc(S.variant) + " " + esc(S.name) + "</title><style>" + css + "</style></head><body>" + parts.join("\n") + "</body></html>";
  return { html: html, body: parts.join("\n"), text: text.join("\n") };
}
const UNREACH_INT = { lines: [67, 68], line: 54, outcome: "default" };  /* defensive default of can_rx_handler() */
/* the lab steps (tabs 1-5), with what was achieved in each (shown on the tabs, in the Report tab and in the report) */
function stepList() {
  const ro = LANG === "ro"; const v = V(); if (!v) return [];
  const full = (p) => p[1] > 0 && p[0] >= p[1];
  const out = EX_KEYS.map((k) => {
    const ex = EX[k]; const an = analyse(k, v, S.tests[k]); const c = [];
    const add = (ok, lbl) => c.push([!!ok, lbl]);
    if (k === "f1") add(S.asil.stmt && S.asil.branch && S.asil.mcdc, ro ? "ASIL: nivelurile ISO 26262-6" : "ASIL: the ISO 26262-6 levels");
    add(S.ran[k], ro ? "teste rulate" : "tests run");
    add(full(an.req), ro ? "toate cerințele au test" : "every requirement has a test");
    if (k === "int") {
      /* the default branch (lines 67-68, outcome "default" of the switch) cannot be reached by normal inputs:
         "complete" here means every reachable statement and outcome is covered and the rest is justified */
      const unl = an.stmtLines.filter((n) => an.hits[n] === 0);
      const miss = []; an.decisions.forEach((d) => d.missing.forEach((o) => miss.push([d.line, o])));
      add(unl.every((n) => UNREACH_INT.lines.includes(n)), ro ? "statement: tot codul accesibil (liniile 67–68 nu pot fi atinse)" : "statement: all reachable code (lines 67–68 cannot be reached)");
      add(miss.every((m) => m[0] === UNREACH_INT.line && m[1] === UNREACH_INT.outcome), ro ? "branch: toate ramurile accesibile (default nu poate fi atins)" : "branch: all reachable outcomes (default cannot be reached)");
    } else {
      add(full(an.stmt), "statement 100%");
      add(full(an.dec), "branch 100%");
    }
    if (an.mcdc[1] > 0) add(full(an.mcdc), "MC/DC 100%");
    if (an.thr) add(an.thr.every((x) => x.at && x.over), ro ? "valori la limită (BVA)" : "boundary values (BVA)");
    add(an.warned.reduce((a, r) => a + r.chk.warnings.length, 0) === 0, ro ? "fără avertismente la teste" : "no test warnings");
    if (k === bugTab()) {
      add(S.bug.test && S.bug.line && S.bug.fix, ro ? "raportul de incident: testul, linia, corectura" : "the incident report: test, line, fix");
      add(fixOk(), ro ? "corectura trece retestul" : "the fix passes the retest");
      add((S.bug.desc || "").trim(), ro ? "descrierea greșelii: cerința, rezultatul obținut și cel așteptat" : "the defect description: requirement, actual and expected result");
    }
    if (k === "int") {
      add(ex.funcs.every((f) => an.funcs.has(f)) && ex.calls.every((cl) => an.calls.has(cl[0])), ro ? "funcții și apeluri 100%" : "functions and calls 100%");
      add((S.just || "").trim(), ro ? "justificarea codului neacoperit" : "the justification of uncovered code");
    }
    const ok = c.filter((x) => x[0]).length;
    return { n: ex.num, name: t(ex.tab) + " · " + c.map((x) => x[1]).join(", "), status: !S.ran[k] ? "todo" : window.LabReport ? window.LabReport.stepStatus(ok, c.length) : "todo",
      detail: (ro ? "lipsește: " : "missing: ") + (c.filter((x) => !x[0]).map((x) => x[1]).join(", ") || "–") };
  });
  const cDone = CONCL.filter((c) => (S.concl[c[0]] || "").trim()).length;
  out.push({ n: "5", name: ro ? "Raportul: concluzia (ce arată acoperirea și ce nu arată)" : "Report: the conclusion (what coverage shows and what it does not)",
    status: window.LabReport ? window.LabReport.stepStatus(cDone, CONCL.length) : "todo", detail: cDone + " / " + CONCL.length });
  return out;
}
/* structured copy of the work, sent with the report for scoring against the answer key */
function reportData() {
  const v = V(); let resets = 0; try { resets = +localStorage.getItem(RESET_KEY) || 0; } catch (e) { /* storage unavailable */ }
  const ex = {};
  EX_KEYS.forEach((k) => { const an = analyse(k, v, S.tests[k]);
    const miss = []; an.decisions.forEach((d) => d.missing.forEach((o) => miss.push(d.line + ":" + o)));
    const condMiss = []; an.decisions.forEach((d) => d.conds.forEach((c) => { if (!c.shown) condMiss.push(d.line + ": " + c.label); }));
    ex[k] = { tests: S.tests[k], ran: !!S.ran[k], stmt: an.stmt, dec: an.dec, mcdc: an.mcdc, req: an.req, uncovered: an.stmtLines.filter((n) => an.hits[n] === 0),
      missingOutcomes: miss, mcdcNotShown: condMiss, reqMissing: an.reqMissing, bva: an.thr ? an.thr.map((x) => ({ name: x.name, at: !!x.at, over: !!x.over })) : null,
      warningsLeft: an.warned.reduce((a, r) => a + r.chk.warnings.length, 0), hist: histOf(k), notes: S.notes[k] || "" }; });
  return { variant: S.variant, lang: LANG, asil: S.asil, bug: Object.assign({}, S.bug, { fixCheck: fixCheck() }), just: S.just, concl: S.concl, resets: resets, ex: ex, steps: stepList().map((x) => ({ n: x.n, status: x.status, detail: x.detail })) };
}
function renderReport(view) {
  if (window.LabReport) window.LabReport.snapshot("SW-TCA", reportData);
  const r = buildReport();
  view.innerHTML = '<div class="row" style="justify-content:space-between"><h2>' + t("reportTitle") + '</h2><div class="row">' +
    '<button class="btn primary" id="dl" type="button">' + t("download") + '</button><button class="btn" id="cp" type="button">' + t("copy") + "</button></div></div>" +
    '<p class="muted">' + t("reportHint") + "</p>" + (window.LabReport ? window.LabReport.stepsHtml(stepList(), LANG, false) : "") + '<div class="panel stack"><h3>' + esc(t("conclusion")) + "</h3>" +
    CONCL.map((c) => '<label class="label" for="concl_' + c[0] + '">' + esc(t(c[1])) + '</label><textarea id="concl_' + c[0] + '" data-concl="' + c[0] + '">' + esc(S.concl[c[0]] || "") + "</textarea>").join("") + "</div>" +
    '<div id="sendBox"></div><div class="report-frame" id="rframe">' + r.body + "</div>" +
    '<textarea id="reportText" readonly hidden></textarea>';
  if (window.LabReport) window.LabReport.mount(view.querySelector("#sendBox"), { lab: "SW-TCA", lang: LANG, demo: isDemo(), getPayload: () => {
    const x = buildReport(); const v = V();
    const sum = EX_KEYS.map((k) => { const an = analyse(k, v, S.tests[k]); return EX[k].fn + " " + pct(an.stmt) + " / " + pct(an.dec) + " / " + pct(an.mcdc) + " ⚠" + an.warned.length; }).join("; ");
    return { name: S.name, group: S.group, variant: S.variant, html: x.html, text: x.text, data: reportData(), summary: "stmt / branch / MC/DC: " + sum + " · bug: " + ((S.bug && S.bug.line) || "-") };
  } });
  view.querySelectorAll("textarea[data-concl]").forEach((n) => {
    n.addEventListener("input", () => { S.concl[n.dataset.concl] = n.value; save(); });
    n.addEventListener("change", () => { view.querySelector("#rframe").innerHTML = buildReport().body; });
  });
  view.querySelector("#dl").addEventListener("click", () => {
    const b = new Blob([buildReport().html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "SW-TCA_" + (S.variant || "V") + "_" + (S.name || "student").replace(/[^\w\-]+/g, "_") + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  view.querySelector("#cp").addEventListener("click", () => {
    const txt = buildReport().text;
    const ta = view.querySelector("#reportText");
    const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast(t("copyFail")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback);
    else fallback();
  });
}

/* ---------------------------------------------------------------- boot */
load();
LANG = S.lang || "ro";
if (!S.concl) S.concl = { cov: "", lim: "" };
if (window.LabReport) window.LabReport.track("SW-TCA");
document.getElementById("stName").value = S.name;
document.getElementById("stVariant").value = S.variant;
document.getElementById("stName").addEventListener("input", (e) => { S.name = e.target.value; save(); });
document.getElementById("studentForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = document.getElementById("stVariant").value.trim().toUpperCase();
  if (!VARIANTS[code]) { toast(t("badVariant")); return; }
  if (code !== S.variant) {
    S.variant = code;
    S.ran = { f1: false, f2: false, f3: false, int: false };
    if (!S.tests.f1.length) {
      const e1 = EX.f1.example;
      S.tests.f1.push({ id: "T1", inputs: Object.assign({}, e1.inputs), expected: e1.expected, req: e1.req, example: true });
      if (!S.seeded) S.seeded = {};
      S.seeded[code + ":f1"] = true;
    }
  }
  document.getElementById("stVariant").value = code;
  S.tab = S.tab === "start" ? "f1" : S.tab;
  save(); render(); toast(t("variantLoaded").replace("{v}", code));
});
/* start over: two clicks within 5 s clear this app's saved work */
(function () {
  const b = document.getElementById("resetAll"); let armed = 0, timer = null;
  b.addEventListener("click", () => {
    if (Date.now() - armed < 5000) {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({ lang: LANG }));
        localStorage.setItem(RESET_KEY, String((+localStorage.getItem(RESET_KEY) || 0) + 1));
      } catch (e) { /* storage unavailable */ }
      if (window.LabReport) window.LabReport.resetWork("SW-TCA");
      location.reload(); return;
    }
    armed = Date.now(); b.textContent = t("resetConfirm"); b.classList.add("danger");
    clearTimeout(timer); timer = setTimeout(() => { armed = 0; b.textContent = t("reset"); b.classList.remove("danger"); }, 5000);
  });
})();
document.getElementById("langRo").addEventListener("click", () => { LANG = "ro"; S.lang = "ro"; save(); render(); });
document.getElementById("langEn").addEventListener("click", () => { LANG = "en"; S.lang = "en"; save(); render(); });
render();
</script>
