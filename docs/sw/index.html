<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SW TCA Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: test-bench workspace. Header with student/variant, tab rail of exercises,
   requirements + annotated source side by side, test table and coverage readout below. */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17202D;
  --muted: #5B6578;
  --line: #D9DEE7;
  --accent: #2443C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFB;
  --code-bg: #F9FAFC;
  --ok: #1D7F54;
  --ok-bg: #DFF2E8;
  --bad: #B83434;
  --bad-bg: #FBE6E6;
  --warn: #9A6514;
  --warn-bg: #FAEFD8;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Helvetica, Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
    --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
    --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131B; --surface: #151C27; --ink: #E5E9F1; --muted: #98A2B4; --line: #2A3343;
  --accent: #8197FF; --accent-ink: #0E131B; --accent-soft: #1D2747; --code-bg: #111823;
  --ok: #4BC287; --ok-bg: #12301F; --bad: #F07474; --bad-bg: #3A1B1D; --warn: #E2B15C; --warn-bg: #35290F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--font-body);
}
.wrap {
  max-width: 1380px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: 0.01em; }
h2 { font-size: 1.3rem; font-weight: 600; }
h3 { font-size: 1.02rem; font-weight: 600; }
p { margin: 0; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); }
.label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { background: var(--surface); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px; }
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand .sub { font-size: 0.85rem; color: var(--muted); }
.student { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; margin-left: auto; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field input, .field select { height: 34px; padding: 0 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); min-width: 0; }
.field input.w-name { width: 190px; }
.field input.w-small { width: 92px; }
.btn { height: 34px; padding: 0 14px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { height: 28px; padding: 0 10px; font-size: 0.85rem; }
.btn.ghost { background: transparent; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.lang button { border: 0; background: transparent; padding: 0 10px; height: 32px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.neutral { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

/* tabs */
nav.tabs { border-bottom: 1px solid var(--line); background: var(--surface); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; }
nav.tabs button { border: 0; background: transparent; padding: 12px 14px 10px; cursor: pointer; border-bottom: 3px solid transparent; font-family: var(--font-display); font-weight: 600; font-size: 0.98rem; color: var(--muted); white-space: nowrap; }
nav.tabs button .num { font-family: var(--font-mono); font-size: 0.8rem; margin-right: 6px; }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs button:disabled { opacity: 0.45; cursor: not-allowed; }

main .wrap { padding-block: 22px 48px; display: flex; flex-direction: column; gap: 18px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 18px; align-items: start; }
@media (max-width: 1000px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* intro */
.intro { max-width: 70ch; display: flex; flex-direction: column; gap: 12px; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.step { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.step .fn { font-family: var(--font-mono); font-size: 0.85rem; color: var(--accent); }
.notice { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.notice.bad { border-left-color: var(--bad); background: var(--bad-bg); }

/* requirements */
.req { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.req:first-child { border-top: 0; }
.req .id { font-family: var(--font-mono); font-size: 0.82rem; font-weight: 600; color: var(--accent); white-space: nowrap; padding-top: 1px; }
.req .txt { font-size: 0.93rem; }
.task { font-size: 0.95rem; display: flex; flex-direction: column; gap: 6px; }
.task ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 3px; }

/* code */
.code { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; font-family: var(--font-mono); font-size: 0.83rem; line-height: 1.6; }
.code table { border-collapse: collapse; width: 100%; }
.code td { padding: 0 10px; white-space: pre; vertical-align: top; }
.code td.n { color: var(--muted); text-align: right; width: 1%; user-select: none; border-right: 1px solid var(--line); }
.code td.h { text-align: right; width: 1%; user-select: none; color: var(--muted); }
.code td.d { width: 1%; user-select: none; }
.code tr.ctx td { color: var(--muted); }
.code tr.hit td.src { background: var(--ok-bg); }
.code tr.miss td.src { background: var(--bad-bg); }
.code tr.part td.src { background: var(--warn-bg); }
.code tr.miss td.h { color: var(--bad); font-weight: 600; }
.code .sep td { height: 8px; border-bottom: 1px dashed var(--line); }
.tf { display: inline-flex; gap: 3px; }
.tf span { display: inline-block; min-width: 1.5em; text-align: center; border-radius: 3px; font-size: 0.72rem; font-weight: 600; line-height: 1.5; padding: 0 3px; }
.tf .y { background: var(--ok-bg); color: var(--ok); }
.tf .n0 { background: var(--bad-bg); color: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.8rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; vertical-align: -2px; margin-right: 5px; }

/* tests */
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); }
table.tests { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
table.tests th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
table.tests td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.tests tr:last-child td { border-bottom: 0; }
table.tests input, table.tests select { height: 30px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); padding: 0 6px; font-family: var(--font-mono); font-size: 0.85rem; }
table.tests input { width: 108px; }
table.tests input.invalid { border-color: var(--bad); background: var(--bad-bg); }
table.tests td.tid { font-family: var(--font-mono); font-weight: 600; white-space: nowrap; }
table.tests td.act { font-family: var(--font-mono); white-space: nowrap; }
.xbtn { border: 0; background: transparent; cursor: pointer; color: var(--muted); font-size: 1.1rem; padding: 0 4px; }
.xbtn:hover { color: var(--bad); }

/* metrics */
.meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.meter { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.meter .val { font-family: var(--font-mono); font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter .frac { font-family: var(--font-mono); font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--warn); }
.meter.full .bar > i { background: var(--ok); }
.meter.full .val { color: var(--ok); }
.findings { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.findings ul { margin: 6px 0 0; padding-left: 1.1em; font-size: 0.9rem; display: flex; flex-direction: column; gap: 3px; }
table.tt { border-collapse: collapse; font-family: var(--font-mono); font-size: 0.82rem; margin-top: 6px; }
table.tt th, table.tt td { border: 1px solid var(--line); padding: 3px 8px; text-align: center; white-space: nowrap; }
table.tt th { background: var(--bg); font-weight: 600; }
table.tt td.c-y { color: var(--ok); }
table.tt td.c-n { color: var(--bad); }
.condlist { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; font-size: 0.88rem; }
.condlist div { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
textarea { width: 100%; min-height: 84px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); padding: 8px 10px; resize: vertical; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.formgrid .field input, .formgrid .field select { width: 100%; }
.report-frame { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 18px; overflow-x: auto; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--radius); font-size: 0.9rem; z-index: 20; }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width 0.35s ease; } }
@media (max-width: 640px) {
  .student { margin-left: 0; }
  .field input.w-name { width: 150px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>SW TCA Lab</h1>
      <span class="sub" data-i18n="subtitle"></span>
    </div>
    <form class="student" id="studentForm" autocomplete="off">
      <div class="field"><label class="label" for="stName" data-i18n="name"></label><input id="stName" class="w-name"></div>
      <div class="field"><label class="label" for="stGroup" data-i18n="group"></label><input id="stGroup" class="w-small"></div>
      <div class="field"><label class="label" for="stVariant" data-i18n="variant"></label><input id="stVariant" class="w-small mono" placeholder="V1"></div>
      <button class="btn primary" id="loadVariant" type="submit" data-i18n="load"></button>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="langRo" aria-pressed="true">RO</button>
        <button type="button" id="langEn" aria-pressed="false">EN</button>
      </div>
    </form>
  </div>
</header>
<nav class="tabs" aria-label="Exercises">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden></div>

const RANGES = { u32: [0, 4294967295], u8: [0, 255], i16: [-32768, 32767], u16: [0, 65535] };
function parseNum(str, type) {

  if (/^-?0x[0-9a-f]+$/i.test(s)) n = (s[0] === "-" ? -1 : 1) * parseInt(s.replace(/^-/, "").slice(2), 16);
  else if (/^-?\d+$/.test(s)) n = parseInt(s, 10);
  if (!Number.isFinite(n)) return null;

}

/* ---------------------------------------------------------------- coverage */
function analyse(exKey, v, tests) {
  const ex = EX[exKey];
  const code = ex.code(v);
  const decDefs = resolve(ex.decisions, v);
  const stmtLines = code.lines.filter((l) => l[2]).map((l) => l[0]);
  const hits = {}; stmtLines.forEach((n) => { hits[n] = 0; });
  const recs = {}; Object.keys(decDefs).forEach((d) => { recs[d] = []; });
  const funcs = new Set(); const calls = new Set();
  const rows = tests.map((tst) => {
    const p = parseInputs(ex, tst.inputs);
    if (p.bad.length) return { id: tst.id, bad: p.bad };
    const tr = newTrace();
    const actual = ex.exec(p.values, v, tr);
    const lineSrc = exKey === "int" ? tr.handler : tr;
    lineSrc.lines.forEach((n) => { if (n in hits) hits[n]++; });
    lineSrc.dec.forEach((d) => { if (recs[d.id]) recs[d.id].push({ test: tst.id, vals: d.vals, out: d.out }); });
    tr.funcs.forEach((f) => funcs.add(f)); tr.calls.forEach((c) => calls.add(c));
    let verdict = "none";
    if (tst.expected) verdict = (tst.expected === actual) ? "pass" : "fail";
    return { id: tst.id, actual: actual, verdict: verdict };
  });
  /* decisions */
  const decisions = Object.keys(decDefs).map((id) => {
    const def = decDefs[id];
    const outcomes = def.outcomes || [true, false];
    const seen = new Set(recs[id].map((r) => r.out));
    const missing = outcomes.filter((o) => !seen.has(o));
    let conds = [];
    if (!def.outcomes) {
      conds = def.conds.map((label, i) => {
        const pair = findPair(recs[id], i);
        return { label: label, shown: !!pair, pair: pair };
      });
    }
    return { id: id, line: def.line, def: def, outcomes: outcomes, seen: seen, missing: missing, conds: conds, recs: recs[id] };
  });
  const decTotal = decisions.reduce((a, d) => a + d.outcomes.length, 0);
  const decCovered = decisions.reduce((a, d) => a + d.outcomes.length - d.missing.length, 0);
  const condTotal = decisions.reduce((a, d) => a + d.conds.length, 0);
  const condShown = decisions.reduce((a, d) => a + d.conds.filter((c) => c.shown).length, 0);
  const stmtCovered = stmtLines.filter((n) => hits[n] > 0).length;
  const reqIds = ex.reqs(v).map((r) => r[0]);
  const traced = new Set(tests.map((x) => x.req).filter(Boolean));
  const reqMissing = reqIds.filter((r) => !traced.has(r));
  return {
    rows: rows, hits: hits, stmtLines: stmtLines, decisions: decisions,
    stmt: [stmtCovered, stmtLines.length], dec: [decCovered, decTotal], mcdc: [condShown, condTotal],
    req: [reqIds.length - reqMissing.length, reqIds.length], reqMissing: reqMissing,
    funcs: funcs, calls: calls
  };
}
/* Unique-cause MC/DC with short-circuit: conditions not evaluated in a test are "don't care". */
function findPair(rs, i) {
  for (let a = 0; a < rs.length; a++) {
    for (let b = a + 1; b < rs.length; b++) {
      const x = rs[a], y = rs[b];
      if (x.vals[i] === undefined || y.vals[i] === undefined) continue;
      if (x.vals[i] === y.vals[i] || x.out === y.out) continue;
      let ok = true;
      for (let j = 0; j < x.vals.length; j++) {
        if (j === i) continue;
        if (x.vals[j] !== undefined && y.vals[j] !== undefined && x.vals[j] !== y.vals[j]) { ok = false; break; }
      }
      if (ok) return [x.test, y.test];
    }
  }
  return null;
}

  let n = 1; const used = new Set(S.tests[exKey].map((x) => x.id));
  while (used.has(prefix + n)) n++;
  return prefix + n;
}
function blankInputs(ex) { const o = {}; ex.inputs.forEach((f) => { o[f.k] = f.type === "bool" ? "false" : ""; }); return o; }

/* ---------------------------------------------------------------- rendering helpers */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const el = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
function toast(msg) {
  const tEl = document.getElementById("toast"); tEl.textContent = msg; tEl.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { tEl.hidden = true; }, 2600);
}
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
  document.getElementById("langRo").setAttribute("aria-pressed", String(LANG === "ro"));
  document.getElementById("langEn").setAttribute("aria-pressed", String(LANG === "en"));
}

function renderTabs() {
  const box = document.getElementById("tabs");
  const items = [["start", t("tabStart"), ""]].concat(EX_KEYS.map((k) => [k, t(EX[k].tab), EX[k].num])).concat([["report", t("tabReport"), "5"]]);
  box.innerHTML = items.map((it) =>
    '<button role="tab" data-tab="' + it[0] + '" aria-selected="' + (S.tab === it[0]) + '"' +
    ((it[0] !== "start" && !V()) ? " disabled" : "") + ">" + (it[2] ? '<span class="num">' + it[2] + "</span>" : "") + esc(it[1]) + "</button>").join("");
  box.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { S.tab = b.dataset.tab; save(); render(); }));
}

function render() {
  applyI18n();
  renderTabs();
  const view = document.getElementById("view");
  if (S.tab === "start" || !V()) { view.innerHTML = renderStart(); return; }
  if (S.tab === "report") { renderReport(view); return; }
  renderExercise(view, S.tab);
}

function renderStart() {
  const v = V();
  return '<section class="intro">' +
    '<h2>' + esc(t("introTitle")) + '</h2>' +
    '<p>' + esc(t("introP1")) + '</p><p>' + esc(t("introP2")) + '</p>' +
    (v ? '<p class="notice">' + esc(t("variantLoaded").replace("{v}", S.variant)) + '</p>' : '<p class="notice">' + esc(t("introP3")) + '</p>') +
    '</section>' +
    '<section class="stack"><span class="label">' + esc(t("introSteps")) + '</span><div class="steps">' +
    [["1", "can_frame_is_valid", "s1"], ["2", "sensor_value_plausible", "s2"], ["3", "can_error_state", "s3"], ["4", "can_rx_handler", "s4"], ["5", "", "s5"]]
      .map((s) => '<div class="step"><h3>' + s[0] + ". " + esc(s[0] === "5" ? t("tabReport") : t(EX[EX_KEYS[+s[0] - 1]].tab)) + '</h3>' +
        (s[1] ? '<span class="fn">' + s[1] + '()</span>' : "") + '<p class="muted">' + esc(t(s[2])) + '</p></div>').join("") +
    '</div></section>';
}

function renderCode(exKey, an) {
  const ex = EX[exKey]; const v = V(); const code = ex.code(v);
  const decByLine = {}; if (an) an.decisions.forEach((d) => { decByLine[d.line] = d; });
  let rows = code.ctx.map((c) => '<tr class="ctx"><td class="n">h</td><td class="h"></td><td class="d"></td><td class="src">' + esc(c) + "</td></tr>").join("");
  rows += '<tr class="sep"><td colspan="4"></td></tr>';
  rows += code.lines.map((l) => {
    const n = l[0], src = l[1], isStmt = !!l[2];
    let cls = "", h = "", d = "";
    if (an && isStmt) {
      const c = an.hits[n];
      h = c > 0 ? String(c) : "#####";
      cls = c > 0 ? "hit" : "miss";
      const dec = decByLine[n];
      if (dec) {
        if (c > 0 && dec.missing.length) cls = "part";
        const labels = dec.def.outcomes ? dec.outcomes.map((o) => [o === "ACTIVE/PASSIVE" ? "A/P" : o === "BUS_OFF" ? "BO" : "def", dec.seen.has(o)])
                                         : [["T", dec.seen.has(true)], ["F", dec.seen.has(false)]];
        d = '<span class="tf">' + labels.map((x) => '<span class="' + (x[1] ? "y" : "n0") + '">' + x[0] + "</span>").join("") + "</span>";
      }
    }
    return '<tr class="' + cls + '"><td class="n">' + n + '</td><td class="h">' + h + '</td><td class="d">' + d + '</td><td class="src">' + esc(src) + "</td></tr>";
  }).join("");
  return '<div class="code"><table>' + rows + "</table></div>" +
    '<div class="legend"><span><i style="background:var(--ok-bg)"></i>' + esc(t("legendHit")) + '</span><span><i style="background:var(--bad-bg)"></i>' + esc(t("legendMiss")) +
    '</span><span><i style="background:var(--warn-bg)"></i>' + esc(t("legendPart")) + '</span><span>' + esc(t("legendTF")) + "</span></div>";
}

function renderTests(exKey, an) {
  const ex = EX[exKey]; const v = V();
  const reqIds = ex.reqs(v).map((r) => r[0]);
  const rowRes = {}; if (an) an.rows.forEach((r) => { rowRes[r.id] = r; });
  const head = "<tr><th>" + t("colId") + "</th>" + ex.inputs.map((f) => "<th>" + f.k + "</th>").join("") +
    "<th>" + t("colExpected") + "</th><th>" + t("colReq") + "</th><th>" + t("colActual") + "</th><th>" + t("colVerdict") + "</th><th></th></tr>";
  const body = S.tests[exKey].map((tst, idx) => {
    const r = rowRes[tst.id];
    const badSet = new Set(r && r.bad ? r.bad : []);
    const cells = ex.inputs.map((f) => {
      const val = tst.inputs[f.k];
      if (f.type === "bool") return '<td><select data-ex="' + exKey + '" data-i="' + idx + '" data-k="' + f.k + '" aria-label="' + f.k + '">' +
        BOOL.map((b) => '<option' + (val === b ? " selected" : "") + ">" + b + "</option>").join("") + "</select></td>";
      return '<td><input data-ex="' + exKey + '" data-i="' + idx + '" data-k="' + f.k + '" aria-label="' + f.k + '" value="' + esc(val) + '"' +
        (badSet.has(f.k) ? ' class="invalid"' : "") + ' placeholder="' + (f.hex ? "0x…" : "0") + '"></td>';
    }).join("");
    const expSel = '<select data-ex="' + exKey + '" data-i="' + idx + '" data-k="__exp" aria-label="' + t("colExpected") + '"><option value="">–</option>' +
      ex.outputs.map((o) => '<option' + (tst.expected === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select>";
    const reqSel = '<select data-ex="' + exKey + '" data-i="' + idx + '" data-k="__req" aria-label="' + t("colReq") + '"><option value="">–</option>' +
      reqIds.map((o) => '<option' + (tst.req === o ? " selected" : "") + ">" + o + "</option>").join("") + "</select>";
    let act = "", verdict = "";
    if (r) {
      if (r.bad) { verdict = '<span class="chip bad">' + t("invalid") + "</span>"; }
      else {
        act = esc(r.actual);
        verdict = r.verdict === "pass" ? '<span class="chip ok">' + t("pass") + "</span>" :
                  r.verdict === "fail" ? '<span class="chip bad">' + t("fail") + "</span>" : '<span class="chip neutral">' + t("noExp") + "</span>";
      }
    }
    return '<tr><td class="tid">' + esc(tst.id) + (tst.example ? ' <span class="chip neutral">' + t("exampleRow") + "</span>" : "") + "</td>" + cells +
      "<td>" + expSel + "</td><td>" + reqSel + '</td><td class="act">' + act + "</td><td>" + verdict + "</td>" +
      '<td><button class="xbtn" data-del="' + idx + '" data-ex="' + exKey + '" aria-label="' + t("deleteTest") + '" title="' + t("deleteTest") + '">×</button></td></tr>';
  }).join("");
  return '<div class="tablewrap"><table class="tests"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>";
}

function meter(label, frac) {
  const pct = frac[1] ? Math.round(100 * frac[0] / frac[1]) : 0;
  return '<div class="meter' + (frac[1] && frac[0] === frac[1] ? " full" : "") + '"><span class="label">' + esc(label) + '</span>' +
    '<span class="val">' + pct + '%</span><div class="bar"><i style="width:' + pct + '%"></i></div><span class="frac">' + frac[0] + " / " + frac[1] + "</span></div>";
}

function truthTable(d) {
  if (d.conds.length < 2) return "";
  const letters = d.conds.map((_, i) => String.fromCharCode(65 + i));
  const head = "<tr><th>Test</th>" + letters.map((L) => "<th>" + L + "</th>").join("") + "<th>" + t("outcome") + "</th></tr>";
  const body = d.recs.map((r) => "<tr><td>" + esc(r.test) + "</td>" + r.vals.map((x) => x === undefined ? "<td>–</td>" : '<td class="' + (x ? "c-y" : "c-n") + '">' + (x ? 1 : 0) + "</td>").join("") +
    '<td class="' + (r.out ? "c-y" : "c-n") + '">' + (r.out ? 1 : 0) + "</td></tr>").join("");
  const list = d.conds.map((c, i) => "<div><strong class=\"mono\">" + letters[i] + "</strong><span class=\"mono\">" + esc(c.label) + "</span>" +
    (c.shown ? '<span class="chip ok">' + t("shown") + " " + esc(c.pair[0]) + "–" + esc(c.pair[1]) + "</span>" : '<span class="chip bad">' + t("notShown") + "</span>") + "</div>").join("");
  return '<div><h3>' + t("mcdcTitle") + " · " + t("line") + " " + d.line + '</h3><div class="tablewrap" style="display:inline-block;max-width:100%;border:0"><table class="tt">' + head + body + '</table></div><div class="condlist">' + list + "</div></div>";
}

function renderResults(exKey, an) {
  if (!an) return '<p class="muted">' + esc(t("notRun")) + "</p>";
  const ex = EX[exKey];
  let html = '<div class="meters">' + meter(t("mStmt"), an.stmt) + meter(t("mDec"), an.dec) + meter(t("mMcdc"), an.mcdc) + meter(t("mReq"), an.req);
  if (exKey === "int") {
    html += meter(t("mFunc"), [ex.funcs.filter((f) => an.funcs.has(f)).length, ex.funcs.length]);
    html += meter(t("mCall"), [ex.calls.filter((c) => an.calls.has(c[0])).length, ex.calls.length]);
  }
  html += "</div>";
  const unl = an.stmtLines.filter((n) => an.hits[n] === 0);
  const miss = [];
  an.decisions.forEach((d) => d.missing.forEach((o) => miss.push(t("line") + " " + d.line + ": " + (o === true ? "true" : o === false ? "false" : o))));
  const singles = an.decisions.filter((d) => d.conds.length === 1 && !d.conds[0].shown);
  html += '<div class="findings">' +
    "<div><h3>" + t("uncoveredLines") + "</h3><ul>" + (unl.length ? unl.map((n) => "<li>" + t("line") + " " + n + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>" +
    "<div><h3>" + t("missingOutcomes") + "</h3><ul>" + (miss.length ? miss.map((m) => "<li>" + esc(m) + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>" +
    "<div><h3>" + t("reqMissing") + "</h3><ul>" + (an.reqMissing.length ? an.reqMissing.map((r) => '<li class="mono">' + r + "</li>").join("") : "<li>" + t("none") + "</li>") + "</ul></div>";
  if (singles.length) html += "<div><h3>MC/DC · " + t("notShown") + "</h3><ul>" + singles.map((d) => '<li><span class="mono">' + esc(d.conds[0].label) + "</span> (" + t("line") + " " + d.line + ")</li>").join("") + "</ul></div>";
  html += "</div>";
  const tts = an.decisions.map(truthTable).filter(Boolean).join("");
  if (tts) html += '<div class="findings">' + tts + "</div>";
  if (exKey === "int") {
    html += "<div><h3>" + t("funcTitle") + '</h3><div class="row" style="margin-top:6px">' +
      ex.funcs.map((f) => '<span class="chip ' + (an.funcs.has(f) ? "ok" : "bad") + '"><span class="mono">' + f + "()</span> " + (an.funcs.has(f) ? t("called") : t("notCalled")) + "</span>").join("") + "</div>" +
      '<div class="row" style="margin-top:8px">' + ex.calls.map((c) => '<span class="chip ' + (an.calls.has(c[0]) ? "ok" : "bad") + '">' + t("line") + " " + c[1] + ": <span class=\"mono\">" + c[2] + "</span> " + (an.calls.has(c[0]) ? t("exec") : t("notExec")) + "</span>").join("") + "</div></div>";
  }
  return html;
}

function asilBlock() {

    [["++", t("hr")], ["+", t("r")], ["o", t("nr")]].map((o) => '<option value="' + o[0] + '"' + (S.asil[k] === o[0] ? " selected" : "") + ">" + esc(o[1]) + "</option>").join("") + "</select>";
  return '<div class="panel stack"><h3>' + t("asilTitle") + '</h3><p class="muted">' + t("asilHint") + '</p><div class="formgrid">' +

    '<div class="field"><label class="label" for="asil_branch">Branch coverage</label>' + opts("branch") + "</div>" +
    '<div class="field"><label class="label" for="asil_mcdc">MC/DC</label>' + opts("mcdc") + "</div></div></div>";
}
function bugBlock() {
  return '<div class="panel stack"><h3>' + t("bugTitle") + '</h3><p class="muted">' + t("bugHint") + '</p><div class="formgrid">' +

    '<div class="field"><label class="label" for="bug_desc">' + t("bugDesc") + '</label><textarea id="bug_desc" data-bug="desc">' + esc(S.bug.desc) + "</textarea></div></div>";

function justBlock() {
  return '<div class="panel stack"><h3>' + t("justTitle") + '</h3><p class="muted">' + t("justHint") + '</p><textarea id="just_txt" data-just="1">' + esc(S.just) + "</textarea></div>";
}

const ANALYSIS = {};
function renderExercise(view, exKey) {
  const ex = EX[exKey]; const v = V();
  const an = S.ran[exKey] ? analyse(exKey, v, S.tests[exKey]) : null;
  ANALYSIS[exKey] = an;
  const reqs = ex.reqs(v).map((r) => '<div class="req"><span class="id">' + r[0] + '</span><span class="txt">' + esc(r[1]) + "</span></div>").join("");
  view.innerHTML =
    '<div class="row" style="justify-content:space-between"><h2><span class="mono" style="color:var(--accent)">' + ex.fn + '()</span></h2>' +
    '<span class="chip">ASIL B · ' + esc(S.variant) + "</span></div>" +
    (exKey === "f1" ? asilBlock() : "") +
    '<div class="grid2">' +
      '<div class="stack"><div class="panel stack"><span class="label">' + t("task") + '</span><div class="task"><ol>' + t(ex.task).map((s) => "<li>" + esc(s) + "</li>").join("") + "</ol></div></div>" +
      '<div class="panel"><span class="label">' + t("requirements") + "</span>" + reqs + "</div></div>" +
      '<div class="panel stack"><span class="label">' + t("code") + " · can_node.c</span>" + renderCode(exKey, an) + "</div>" +
    "</div>" +
    '<div class="panel stack"><div class="row" style="justify-content:space-between"><h3>' + t("tests") + '</h3><div class="row">' +
      '<button class="btn" id="addTest" type="button">+ ' + t("addTest") + '</button><button class="btn primary" id="runTests" type="button">▶ ' + t("run") + "</button></div></div>" +
      renderTests(exKey, an) + "</div>" +
    '<div class="panel stack"><h3>' + t("results") + "</h3>" + renderResults(exKey, an) + "</div>" +
    (exKey === "f3" ? bugBlock() : "") + (exKey === "int" ? justBlock() : "") +
    '<div class="panel stack"><label class="label" for="notes_' + exKey + '">' + t("notes") + '</label><textarea id="notes_' + exKey + '" data-notes="' + exKey + '">' + esc(S.notes[exKey]) + "</textarea></div>";

  /* events */
  view.querySelector("#addTest").addEventListener("click", () => {
    S.tests[exKey].push({ id: nextId(exKey), inputs: blankInputs(ex), expected: "", req: "" }); save(); render();
  });
  view.querySelector("#runTests").addEventListener("click", () => { S.ran[exKey] = true; save(); render(); });
  view.querySelectorAll("[data-ex][data-i]").forEach((n) => {
    n.addEventListener("change", () => {
      const tst = S.tests[exKey][+n.dataset.i];
      if (n.dataset.k === "__exp") tst.expected = n.value;
      else if (n.dataset.k === "__req") tst.req = n.value;
      else tst.inputs[n.dataset.k] = n.value;
      tst.example = false; save();
    });
  });
  view.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", () => {
    S.tests[exKey].splice(+b.dataset.del, 1); save(); render();
  }));
  view.querySelectorAll("[data-notes]").forEach((n) => n.addEventListener("input", () => { S.notes[exKey] = n.value; save(); }));
  view.querySelectorAll("[data-asil]").forEach((n) => n.addEventListener("change", () => { S.asil[n.dataset.asil] = n.value; save(); }));
  view.querySelectorAll("[data-bug]").forEach((n) => n.addEventListener("input", () => { S.bug[n.dataset.bug] = n.value; save(); }));
  view.querySelectorAll("[data-just]").forEach((n) => n.addEventListener("input", () => { S.just = n.value; save(); }));
}

/* ---------------------------------------------------------------- report */
function pct(f) { return f[1] ? Math.round(100 * f[0] / f[1]) + "% (" + f[0] + "/" + f[1] + ")" : "–"; }
function buildReport() {
  const v = V(); const now = new Date();
  const parts = []; const text = [];
  const asilTxt = (k) => ({ "++": t("hr"), "+": t("r"), "o": t("nr") }[S.asil[k]] || "–");
  parts.push("<h1>" + esc(t("reportTitle")) + " · SW TCA</h1>");
  parts.push("<p><strong>" + t("student") + ":</strong> " + esc(S.name || "–") + " · <strong>" + t("group") + ":</strong> " + esc(S.group || "–") +
    " · <strong>" + t("variant") + ":</strong> " + esc(S.variant) + " · <strong>" + t("generated") + ":</strong> " + now.toLocaleString(LANG === "ro" ? "ro-RO" : "en-GB") + "</p>");
  text.push(t("reportTitle") + " · SW TCA", t("student") + ": " + (S.name || "–") + " | " + t("group") + ": " + (S.group || "–") + " | " + t("variant") + ": " + S.variant + " | " + t("generated") + ": " + now.toISOString(), "");
  parts.push("<h2>ASIL B · ISO 26262-6</h2><ul><li>Statement: " + esc(asilTxt("stmt")) + "</li><li>Branch: " + esc(asilTxt("branch")) + "</li><li>MC/DC: " + esc(asilTxt("mcdc")) + "</li></ul>");
  text.push("ASIL B: Statement = " + asilTxt("stmt") + "; Branch = " + asilTxt("branch") + "; MC/DC = " + asilTxt("mcdc"), "");
  EX_KEYS.forEach((k) => {
    const ex = EX[k]; const an = analyse(k, v, S.tests[k]);
    parts.push("<h2>" + ex.num + ". " + ex.fn + "()</h2>");
    text.push(ex.num + ". " + ex.fn + "()");
    const head = "<tr><th>ID</th>" + ex.inputs.map((f) => "<th>" + f.k + "</th>").join("") + "<th>" + t("colExpected") + "</th><th>" + t("colReq") + "</th><th>" + t("colActual") + "</th><th>" + t("colVerdict") + "</th></tr>";
    const rows = S.tests[k].map((tst, i) => {
      const r = an.rows[i];
      const verdict = r.bad ? t("invalid") : r.verdict === "pass" ? t("pass") : r.verdict === "fail" ? t("fail") : t("noExp");
      text.push("  " + tst.id + ": " + ex.inputs.map((f) => f.k + "=" + tst.inputs[f.k]).join(", ") + " | exp=" + (tst.expected || "–") + " | req=" + (tst.req || "–") + " | act=" + (r.bad ? "–" : r.actual) + " | " + verdict);
      return "<tr><td>" + esc(tst.id) + "</td>" + ex.inputs.map((f) => "<td>" + esc(tst.inputs[f.k]) + "</td>").join("") + "<td>" + esc(tst.expected || "–") + "</td><td>" + esc(tst.req || "–") +
        "</td><td>" + esc(r.bad ? "–" : r.actual) + "</td><td>" + verdict + "</td></tr>";
    }).join("");
    parts.push('<table class="r">' + head + rows + "</table>");
    const unl = an.stmtLines.filter((n) => an.hits[n] === 0);
    const miss = []; an.decisions.forEach((d) => d.missing.forEach((o) => miss.push(d.line + ":" + (o === true ? "true" : o === false ? "false" : o))));
    const condMiss = []; an.decisions.forEach((d) => d.conds.forEach((c) => { if (!c.shown) condMiss.push(d.line + ": " + c.label); }));
    let cov = "<ul><li>" + t("mStmt") + ": " + pct(an.stmt) + "</li><li>" + t("mDec") + ": " + pct(an.dec) + "</li><li>" + t("mMcdc") + ": " + pct(an.mcdc) + "</li><li>" + t("mReq") + ": " + pct(an.req) + "</li>";
    if (k === "int") {
      const fc = [ex.funcs.filter((f) => an.funcs.has(f)).length, ex.funcs.length];
      const cc = [ex.calls.filter((c) => an.calls.has(c[0])).length, ex.calls.length];
      cov += "<li>" + t("mFunc") + ": " + pct(fc) + "</li><li>" + t("mCall") + ": " + pct(cc) + "</li>";
      text.push("  " + t("mFunc") + ": " + pct(fc) + " | " + t("mCall") + ": " + pct(cc));
    }
    cov += "<li>" + t("uncoveredLines") + ": " + (unl.length ? unl.join(", ") : t("none")) + "</li><li>" + t("missingOutcomes") + ": " + (miss.length ? esc(miss.join(", ")) : t("none")) +
      "</li><li>MC/DC · " + t("notShown") + ": " + (condMiss.length ? esc(condMiss.join("; ")) : t("none")) + "</li><li>" + t("reqMissing") + ": " + (an.reqMissing.length ? an.reqMissing.join(", ") : t("none")) + "</li></ul>";
    parts.push(cov);
    text.push("  " + t("mStmt") + ": " + pct(an.stmt) + " | " + t("mDec") + ": " + pct(an.dec) + " | " + t("mMcdc") + ": " + pct(an.mcdc) + " | " + t("mReq") + ": " + pct(an.req));
    text.push("  " + t("uncoveredLines") + ": " + (unl.length ? unl.join(", ") : t("none")) + " | " + t("missingOutcomes") + ": " + (miss.length ? miss.join(", ") : t("none")));
    text.push("  MC/DC · " + t("notShown") + ": " + (condMiss.length ? condMiss.join("; ") : t("none")) + " | " + t("reqMissing") + ": " + (an.reqMissing.length ? an.reqMissing.join(", ") : t("none")));
    if (k === "f3") {
      parts.push("<h3>" + t("bugTitle") + "</h3><ul><li>" + t("bugTest") + ": " + esc(S.bug.test || "–") + "</li><li>" + t("bugLine") + ": " + esc(S.bug.line || "–") + "</li><li>" + t("bugFix") + ": <code>" + esc(S.bug.fix || "–") + "</code></li></ul><p>" + esc(S.bug.desc || "–").replace(/\n/g, "<br>") + "</p>");
      text.push("  " + t("bugTitle") + ": " + t("bugTest") + "=" + (S.bug.test || "–") + "; " + t("bugLine") + "=" + (S.bug.line || "–") + "; " + t("bugFix") + "=" + (S.bug.fix || "–"), "  " + (S.bug.desc || "–"));
    }
    if (k === "int") {
      parts.push("<h3>" + t("justTitle") + "</h3><p>" + esc(S.just || "–").replace(/\n/g, "<br>") + "</p>");
      text.push("  " + t("justTitle") + ": " + (S.just || "–"));
    }
    if (S.notes[k]) { parts.push("<h3>" + t("notes") + "</h3><p>" + esc(S.notes[k]).replace(/\n/g, "<br>") + "</p>"); text.push("  " + t("notes") + ": " + S.notes[k]); }
    text.push("");
  });
  const css = "body{font:14px/1.5 Arial,Helvetica,sans-serif;color:#17202D;max-width:1000px;margin:24px auto;padding:0 16px}h1{font-size:22px}h2{font-size:17px;margin-top:22px;border-bottom:1px solid #D9DEE7;padding-bottom:4px}h3{font-size:14px}" +
    "table.r{border-collapse:collapse;font-family:Consolas,monospace;font-size:12px}table.r th,table.r td{border:1px solid #D9DEE7;padding:3px 6px;text-align:left}table.r th{background:#F3F5F8}";
  const html = '<!doctype html><html lang="' + LANG + '"><head><meta charset="utf-8"><title>SW TCA ' + esc(S.variant) + " " + esc(S.name) + "</title><style>" + css + "</style></head><body>" + parts.join("\n") + "</body></html>";
  return { html: html, body: parts.join("\n"), text: text.join("\n") };
}
function renderReport(view) {
  const r = buildReport();
  view.innerHTML = '<div class="row" style="justify-content:space-between"><h2>' + t("reportTitle") + '</h2><div class="row">' +
    '<button class="btn primary" id="dl" type="button">' + t("download") + '</button><button class="btn" id="cp" type="button">' + t("copy") + "</button></div></div>" +
    '<p class="muted">' + t("reportHint") + '</p><div class="report-frame">' + r.body + "</div>" +
    '<textarea id="reportText" readonly hidden></textarea>';
  view.querySelector("#dl").addEventListener("click", () => {
    const b = new Blob([buildReport().html], { type: "text/html" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = "SW-TCA_" + (S.variant || "V") + "_" + (S.name || "student").replace(/[^\w\-]+/g, "_") + ".html";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  view.querySelector("#cp").addEventListener("click", () => {
    const txt = buildReport().text;
    const ta = view.querySelector("#reportText");
    const fallback = () => { ta.hidden = false; ta.value = txt; ta.focus(); ta.select(); toast(t("copyFail")); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast(t("copied")), fallback);
    else fallback();
  });
}

/* ---------------------------------------------------------------- boot */
load();
LANG = S.lang || "ro";
document.getElementById("stName").value = S.name;
document.getElementById("stGroup").value = S.group;
document.getElementById("stVariant").value = S.variant;
document.getElementById("stName").addEventListener("input", (e) => { S.name = e.target.value; save(); });
document.getElementById("stGroup").addEventListener("input", (e) => { S.group = e.target.value; save(); });
document.getElementById("studentForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const code = document.getElementById("stVariant").value.trim().toUpperCase();
  if (!VARIANTS[code]) { toast(t("badVariant")); return; }
  if (code !== S.variant) {
    S.variant = code;
    S.ran = { f1: false, f2: false, f3: false, int: false };
    if (!S.tests.f1.length) {
      const e1 = EX.f1.example;
      S.tests.f1.push({ id: "T1", inputs: Object.assign({}, e1.inputs), expected: e1.expected, req: e1.req, example: true });
    }
  }
  document.getElementById("stVariant").value = code;
  S.tab = S.tab === "start" ? "f1" : S.tab;
  save(); render(); toast(t("variantLoaded").replace("{v}", code));
});
document.getElementById("langRo").addEventListener("click", () => { LANG = "ro"; S.lang = "ro"; save(); render(); });
document.getElementById("langEn").addEventListener("click", () => { LANG = "en"; S.lang = "en"; save(); render(); });
render();
</script>
</body>
